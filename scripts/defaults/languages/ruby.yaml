# Ruby: Sinatra (modular style) + puma + faye-websocket. See docs/FORMATS.md section 2.
id: ruby
name: Ruby (Sinatra)
description: Sinatra served by puma. WebSockets use faye-websocket (it runs its own small event loop thread).
capabilities: [rest, websocket]
runtime: "Ruby 3.1+"
runCommand: "bundle install && bundle exec ruby app.rb"
stringStyle: ruby
indent: "  "
literals: { null: "nil", true: "true", false: "false", object: "{}", list: "[]" }
declare: "{{name}} = {{expr}}"
usedMarker: "_ = {{name}}"
dependencies:
  - { name: sinatra, version: "~> 4.1" }
  - { name: puma, version: "~> 6.4" }
  - { name: rackup, version: "~> 2.2" }
  - { name: faye-websocket, version: "~> 0.11", when: websocket }
dependencyFormat: 'gem "{{name}}", "{{version}}"'
devDependencyFormat: 'gem "{{name}}", "{{version}}"'
dependencySeparator: "\n"
packages:
  - id: compression
    name: Compression
    description: gzip answers with Rack::Deflater
    imports: [ 'require "rack/deflater"' ]
    setup: [ "use Rack::Deflater" ]
  - id: access-log
    name: Access log
    description: Writes one line per request to the console (Rack::CommonLogger, Apache common format)
    imports: [ 'require "rack/common_logger"' ]
    setup: [ "use Rack::CommonLogger, $stdout" ]
  - id: hsts
    name: HSTS header
    description: Tells browsers to use HTTPS only. Turn on when the API sits behind HTTPS.
    imports: []
    setup:
      - |
        before do
          headers["Strict-Transport-Security"] = "max-age=63072000; includeSubDomains"
        end
  - id: request-id
    name: Request id
    description: Adds an X-Request-Id header (a fresh random id) to every answer, handy for support requests
    imports: [ 'require "securerandom"' ]
    setup:
      - |
        before do
          headers["X-Request-Id"] = SecureRandom.uuid
        end
websocket:
  imports: [ 'require_relative "ws_rt"' ]
  setup: |
    extend WsRt::Dsl
    mount_ws
    {{wsHandlers}}
files:
  - path: Gemfile
    template: |
      source "https://rubygems.org"

      {{dependencies}}
  - path: app.rb
    template: |
      # {{appName}}: generated by Cosmos-Scintillation. Settings come from .env (see README.md).
      require "sinatra/base"
      require_relative "rt"
      require_relative "store"
      {{wsImports}}
      {{imports}}

      CONFIG = Rt.load_config({{requireApiKey}}, {{port}}, {{maxBodyKb}}, {{rateLimit}})
      Store.open(CONFIG.data_dir, {{schemaJson}})

      class Api < Sinatra::Base
        extend Rt::Routes
        Rt.install(self, CONFIG)
        {{setup}}

        {{routes}}

        {{wsSetup}}
      end

      Api.run!
  - path: rt.rb
    template: |
      # The runtime of the generated API: settings, security and the small helpers the script nodes call.
      require "digest"
      require "json"
      require "openssl"
      require "time"

      module Rt
        # === Settings === #

        Config = Struct.new(:auth, :api_key, :origins, :max_body, :rate_limit, :host, :port, :data_dir, :timeout)

        def self.env_int(name, fallback)
          Integer(ENV.fetch(name, "").strip, 10)
        rescue ArgumentError
          fallback
        end

        # Reads KEY=VALUE lines. Variables that are already set win, so the real environment overrides the file.
        def self.load_env_file(path)
          return unless File.file?(path)
          File.readlines(path, chomp: true).each do |raw|
            line = raw.strip
            next if line.start_with?("#") || !line.include?("=")
            key, value = line.split("=", 2)
            key = key.strip
            ENV[key] = value.strip.gsub(/\A["']|["']\z/, "") unless key.empty? || ENV.key?(key)
          end
        end

        # Reads the settings. It stops the program when the API key is required but missing.
        def self.load_config(auth, port, max_body_kb, rate_limit)
          load_env_file(".env")
          host = ENV.fetch("HOST", "").strip
          dir = ENV.fetch("DATA_DIR", "").strip
          @config = Config.new(
            auth, ENV.fetch("API_KEY", ""),
            ENV.fetch("ALLOWED_ORIGINS", "").split(",").map(&:strip).reject(&:empty?),
            env_int("MAX_BODY_KB", max_body_kb) * 1024, env_int("RATE_LIMIT_PER_MIN", rate_limit),
            host.empty? ? "127.0.0.1" : host, env_int("PORT", port), dir.empty? ? "data" : dir, env_int("REQUEST_TIMEOUT_SECONDS", 15)
          )
          if @config.auth && @config.api_key.empty?
            warn "API_KEY is empty. Set it in .env (or turn the API key off in the script)."
            exit 1
          end
          @config
        end

        def self.config = @config

        def self.origin_allowed?(origin)
          @config.origins.any? { |allowed| allowed == "*" || allowed == origin }
        end

        # Compares the key in constant time (both sides are hashed first, so the length does not leak).
        def self.key_ok?(key)
          return false if @config.api_key.empty? || !key.is_a?(String) || key.empty?
          OpenSSL.fixed_length_secure_compare(Digest::SHA256.digest(key), Digest::SHA256.digest(@config.api_key))
        end

        # === Errors and answers === #

        # Raised by the helpers and turned into a JSON answer by the route wrapper.
        class ApiError < StandardError
          attr_reader :status, :code, :fields

          def initialize(status, code, fields = nil)
            super(code)
            @status = status
            @code = code
            @fields = fields
          end
        end

        def self.fail!(status, code)
          raise ApiError.new(status, code)
        end

        JSON_TYPE = "application/json; charset=utf-8".freeze

        def self.json_text(body)
          JSON.generate(body)
        rescue JSON::GeneratorError, Encoding::UndefinedConversionError
          '{"error":"internal_error"}'
        end

        # Ends the request with a JSON answer (Sinatra's halt).
        def self.reply(ctx, status, body)
          code = to_float(status)
          code = 500 if code.nil? || code < 200 || code > 599
          code = code.to_i
          return ctx.halt(code, {}, "") if [204, 304].include?(code)
          ctx.halt(code, { "content-type" => JSON_TYPE }, json_text(body))
        end

        def self.error_reply(ctx, error)
          if error.is_a?(ApiError)
            body = { "error" => error.code }
            body["fields"] = error.fields if error.fields
            reply(ctx, error.status, body)
          else
            log("error", "unexpected failure")
            reply(ctx, 500, { "error" => "internal_error" })
          end
        end

        # === Security: headers, CORS, rate limit === #

        @hits = {}
        @hits_lock = Mutex.new

        # Counts requests per client in a fixed one minute window. A limit of 0 or less turns it off.
        def self.rate_ok?(key)
          return true if @config.rate_limit <= 0
          now = Process.clock_gettime(Process::CLOCK_MONOTONIC)
          @hits_lock.synchronize do
            entry = @hits[key]
            if entry.nil? || now - entry[0] >= 60
              if @hits.size > 10_000 # bound the memory: forget old clients first, then everybody
                @hits.delete_if { |_, v| now - v[0] >= 60 }
                @hits.clear if @hits.size > 10_000
              end
              entry = @hits[key] = [now, 0]
            end
            entry[1] += 1
            entry[1] <= @config.rate_limit
          end
        end

        # Sinatra settings, the security headers, CORS only for ALLOWED_ORIGINS, the rate limit and the error pages.
        def self.install(app, cfg)
          app.set :environment, :production
          app.set :server, :puma
          app.set :bind, cfg.host
          app.set :port, cfg.port
          app.set :logging, false
          app.set :dump_errors, false
          app.set :raise_errors, false
          app.set :show_exceptions, false
          app.set :protection, false
          app.set :static, false
          app.set :sessions, false
          app.set :host_authorization, { permitted_hosts: [] }
          app.set :server_settings, { Silent: true, Threads: "1:16" }

          app.before do
            headers["X-Content-Type-Options"] = "nosniff"
            headers["X-Frame-Options"] = "DENY"
            headers["Referrer-Policy"] = "no-referrer"
            headers["Content-Security-Policy"] = "default-src 'none'; frame-ancestors 'none'"
            headers["Cache-Control"] = "no-store"
            origin = request.env["HTTP_ORIGIN"].to_s
            allowed = !origin.empty? && Rt.origin_allowed?(origin)
            if allowed
              headers["Vary"] = "Origin"
              headers["Access-Control-Allow-Origin"] = origin
              headers["Access-Control-Allow-Headers"] = "Content-Type, X-API-Key"
              headers["Access-Control-Allow-Methods"] = "GET, POST, PUT, PATCH, DELETE"
              headers["Access-Control-Max-Age"] = "600"
            end
            if request.request_method == "OPTIONS"
              Rt.reply(self, 403, { "error" => "origin_not_allowed" }) unless origin.empty? || allowed
              halt 204
            end
            unless Rt.rate_ok?(request.env["REMOTE_ADDR"].to_s)
              headers["Retry-After"] = "60"
              Rt.reply(self, 429, { "error" => "rate_limited" })
            end
          end

          app.not_found do
            content_type Rt::JSON_TYPE
            '{"error":"not_found"}'
          end

          app.error(Exception) do
            error = env["sinatra.error"]
            content_type Rt::JSON_TYPE
            if error.respond_to?(:http_status) && (400..499).cover?(error.http_status)
              status error.http_status
              '{"error":"bad_request"}'
            else
              Rt.log("error", "unexpected failure")
              status 500
              '{"error":"internal_error"}'
            end
          end
        end

        # === Routes === #

        # What the script sees of a request (or of a WebSocket message: only body is set there).
        Req = Struct.new(:body, :query, :params, :headers)

        # Reads and parses the JSON body (at most MAX_BODY_KB). No body is nil.
        def self.read_body(request)
          return nil if %w[GET HEAD].include?(request.request_method)
          limit = @config.max_body
          fail!(413, "payload_too_large") if request.content_length.to_i > limit
          data = request.body.read(limit + 1).to_s
          fail!(413, "payload_too_large") if data.bytesize > limit
          return nil if data.strip.empty?
          fail!(415, "unsupported_media_type") unless request.content_type.to_s.downcase.include?("json")
          begin
            JSON.parse(data, max_nesting: 64, allow_nan: false)
          rescue JSON::ParserError, JSON::NestingError, EncodingError
            fail!(400, "invalid_json")
          end
        end

        module Routes
          # Registers a route: the key check comes first, then the body is read and parsed.
          def route(verb, path, auth, &block)
            names = path.scan(/:(\w+)/).flatten
            public_send(verb, path) do
              if auth && !Rt.key_ok?(request.env["HTTP_X_API_KEY"])
                Rt.reply(self, 401, { "error" => "unauthorized" })
              end
              begin
                req = Rt::Req.new(Rt.read_body(request), request.GET.to_h, names.to_h { |n| [n, params[n]] }, request.env)
                Timeout.timeout(Rt.config.timeout) { instance_exec(req, &block) }
              rescue Rt::ApiError => e
                Rt.error_reply(self, e)
              rescue Timeout::Error
                Rt.reply(self, 503, { "error" => "timeout" })
              end
            end
          end
        end

        # Writes one line. Line breaks and other control characters are replaced, so text from a request cannot fake a log line.
        def self.log(level, message)
          text = to_text(message).scrub[0, 500].gsub(/[\u0000-\u001f\u007f  ]/, " ")
          name = %w[warn error].include?(level) ? level : "info"
          $stdout.puts("[#{name}] #{text}")
          $stdout.flush
        end

        # === Values: plain JSON values (nil, true/false, Integer, Float, String, Array, Hash) === #

        NUMBER_TEXT = /\A-?[0-9]+(\.[0-9]+)?\z/

        def self.body(req, key) = req.body.is_a?(Hash) ? req.body[key] : nil
        def self.query(req, key) = req.query[key].is_a?(String) ? req.query[key] : nil
        def self.param(req, key) = req.params[key].to_s.empty? ? nil : req.params[key]

        def self.header(req, key)
          value = req.headers["HTTP_#{key.upcase.tr('-', '_')}"]
          value.to_s.empty? ? nil : value
        end

        # The value itself, or the request body when nothing was wired.
        def self.or_body(req, value) = value.nil? ? req.body : value

        # Reads numbers and number-like text ("12", "-3.5"). Other text is not a number.
        def self.to_float(v)
          case v
          when Integer then v.to_f
          when Float then v.finite? ? v : nil
          when String then NUMBER_TEXT.match?(v) ? v.to_f : nil
          end
        end

        def self.tidy(x) = x.finite? && x == x.floor && x.abs < 1e15 ? x.to_i : x

        def self.to_text(v)
          case v
          when nil then ""
          when String then v
          when true then "true"
          when false then "false"
          when Integer then v.to_s
          when Float then v.finite? ? tidy(v).to_s : ""
          else
            begin
              JSON.generate(v)
            rescue StandardError
              ""
            end
          end
        end

        def self.truthy(v)
          case v
          when nil, false then false
          when true then true
          when String then !["", "false", "no", "0"].include?(v.strip.downcase)
          when Array, Hash then !v.empty?
          else
            f = to_float(v)
            f.nil? ? true : f != 0
          end
        end

        def self.cmp(a, op, b)
          return a.is_a?(Array) ? a.any? { |item| to_text(item) == to_text(b) } : to_text(a).include?(to_text(b)) if op == "contains"
          return to_text(a).start_with?(to_text(b)) if op == "startsWith"
          x = to_float(a)
          y = to_float(b)
          order = x && y ? x <=> y : to_text(a) <=> to_text(b)
          case op
          when "eq" then order.zero?
          when "ne" then !order.zero?
          when "lt" then order.negative?
          when "le" then order <= 0
          when "gt" then order.positive?
          when "ge" then order >= 0
          else false
          end
        end

        def self.logic(a, op, b)
          case op
          when "and" then truthy(a) && truthy(b)
          when "or" then truthy(a) || truthy(b)
          else !truthy(a)
          end
        end

        def self.concat(a, b, separator) = to_text(a) + separator + to_text(b)

        def self.text(v, op)
          t = to_text(v)
          case op
          when "upper" then t.upcase
          when "lower" then t.downcase
          when "length" then t.length
          else t.strip
          end
        end

        def self.math(a, op, b)
          x = to_float(a)
          y = to_float(b)
          return nil if x.nil? || y.nil?
          result = case op
                   when "add" then x + y
                   when "sub" then x - y
                   when "mul" then x * y
                   when "div" then y.zero? ? nil : x / y
                   when "mod" then y.zero? ? nil : x.remainder(y)
                   when "min" then [x, y].min
                   when "max" then [x, y].max
                   end
          result.nil? || !result.finite? ? nil : tidy(result)
        end

        def self.now = Time.now.utc.strftime("%Y-%m-%dT%H:%M:%S.%LZ")
        def self.new_id = SecureRandom.uuid
        def self.field(obj, key) = obj.is_a?(Hash) ? obj[key] : nil

        def self.obj(ka, a, kb, b, kc, c)
          out = {}
          [[ka, a], [kb, b], [kc, c]].each { |key, value| out[key] = value unless key.empty? }
          out
        end

        def self.first(list) = list.is_a?(Array) ? list.first : nil
        def self.count(list) = list.is_a?(Array) ? list.length : 0
      end
  - path: ws_rt.rb
    when: websocket
    template: |
      # WebSocket support: origin, key, message size and message rate are checked before an event runs.
      require "faye/websocket"
      require "json"
      require_relative "rt"

      module WsRt
        @handlers = {}
        @clients = []
        @lock = Mutex.new

        def self.handlers = @handlers

        def self.emit(ws, event, data)
          ws.send(JSON.generate({ "event" => event, "data" => data }))
        rescue StandardError
          nil
        end

        # Sends to every other client, or to all of them (including the sender) when `to` is "all".
        def self.broadcast(ws, event, data, to)
          targets = @lock.synchronize { @clients.dup }
          targets.each { |other| emit(other, event, data) if !other.equal?(ws) || to == "all" }
        end

        def self.add(ws) = @lock.synchronize { @clients << ws }
        def self.remove(ws) = @lock.synchronize { @clients.delete(ws) }
        def self.size = @lock.synchronize { @clients.length }

        # Handles one connection: only JSON text messages {"event": "...", "data": ...} are accepted, at most RATE_LIMIT_PER_MIN a minute.
        def self.serve(ws, cfg)
          started = Process.clock_gettime(Process::CLOCK_MONOTONIC)
          messages = 0
          add(ws)
          ws.on :message do |event|
            now = Process.clock_gettime(Process::CLOCK_MONOTONIC)
            started, messages = now, 0 if now - started >= 60
            messages += 1
            if cfg.rate_limit > 0 && messages > cfg.rate_limit
              ws.close(1008, "rate_limited")
              next
            end
            raw = event.data
            message = raw.is_a?(String) && raw.bytesize <= cfg.max_body ? (JSON.parse(raw, max_nesting: 64, allow_nan: false) rescue nil) : nil
            unless message.is_a?(Hash) && message["event"].is_a?(String) && !message["event"].empty?
              emit(ws, "error", { "error" => "invalid_message" })
              next
            end
            handler = @handlers[message["event"]]
            if handler.nil?
              emit(ws, "error", { "error" => "unknown_event" })
              next
            end
            begin
              handler.call(ws, Rt::Req.new(message["data"], {}, {}, {}))
            rescue Rt::ApiError => e
              body = { "error" => e.code }
              body["fields"] = e.fields if e.fields
              emit(ws, "error", body)
            rescue StandardError
              Rt.log("error", "unexpected failure")
              emit(ws, "error", { "error" => "internal_error" })
            end
          end
          ws.on :close do
            remove(ws)
          end
        end

        module Dsl
          def ws_event(name, &block)
            WsRt.handlers[name] = block
          end

          # Adds /ws. It checks the origin and the API key before the upgrade.
          def mount_ws
            Thread.new { EM.run } unless EM.reactor_running?
            get "/ws" do
              cfg = Rt.config
              Rt.reply(self, 426, { "error" => "upgrade_required" }) unless Faye::WebSocket.websocket?(request.env)
              origin = request.env["HTTP_ORIGIN"].to_s
              Rt.reply(self, 403, { "error" => "origin_not_allowed" }) unless origin.empty? || Rt.origin_allowed?(origin)
              key = request.env["HTTP_X_API_KEY"] || params["key"]
              Rt.reply(self, 401, { "error" => "unauthorized" }) if cfg.auth && !Rt.key_ok?(key)
              Rt.reply(self, 503, { "error" => "unavailable" }) if WsRt.size >= 1000
              ws = Faye::WebSocket.new(request.env, nil, { max_length: cfg.max_body, ping: 25 })
              WsRt.serve(ws, cfg)
              halt ws.rack_response
            end
          end
        end
      end
  - path: store.rb
    template: |
      # A small data store for the generated API: tables in memory, saved to data/store.json.
      # It only knows the tables and columns of the schema, so a request can never add or change anything else.
      require "fileutils"
      require "json"
      require_relative "rt"

      module Store
        @lock = Mutex.new
        @tables = {}
        @data = {}
        @file = ""

        # Reads the schema (JSON text made by the exporter) and the saved rows.
        def self.open(dir, schema)
          JSON.parse(schema)["tables"].each do |table|
            @tables[table["name"]] = table
            @data[table["name"]] = []
          end
          @file = File.join(dir, "store.json")
          return unless File.file?(@file)
          saved = JSON.parse(File.read(@file))
          saved.each { |name, rows| @data[name] = rows if @tables.key?(name) && rows.is_a?(Array) } if saved.is_a?(Hash)
        rescue JSON::ParserError, SystemCallError
          nil
        end

        def self.save
          FileUtils.mkdir_p(File.dirname(@file), mode: 0o700)
          temp = "#{@file}.tmp"
          File.write(temp, JSON.generate(@data), perm: 0o600)
          File.rename(temp, @file)
        rescue SystemCallError, JSON::GeneratorError
          Rt.fail!(500, "internal_error")
        end

        def self.table(name)
          @tables[name] || Rt.fail!(500, "internal_error") # names come from the script, never from a request
        end

        # The column to match on: the named one, else the primary key, else the first column.
        def self.resolve(table, name)
          return(table["primary"].to_s.empty? ? table["columns"][0]["name"] : table["primary"]) if name.to_s.empty?
          table["columns"].any? { |c| c["name"] == name } ? name : Rt.fail!(500, "internal_error")
        end

        # Returns [ok, value].
        def self.coerce(kind, v)
          case kind
          when "int"
            f = v == true || v == false ? nil : Rt.to_float(v)
            f && f == f.floor && f.abs <= 9e15 ? [true, f.to_i] : [false, nil]
          when "float"
            f = Rt.to_float(v)
            [!f.nil?, f && Rt.tidy(f)]
          when "bool"
            if v == true || v == false then [true, v]
            elsif v.is_a?(String) && %w[true false].include?(v.downcase) then [true, v.downcase == "true"]
            elsif v.is_a?(Numeric) && [0, 1].include?(v) then [true, v == 1]
            else [false, nil]
            end
          when "json"
            [true, v]
          else
            if v.is_a?(String) || v.is_a?(Numeric) || v == true || v == false
              text = Rt.to_text(v)
              [text.length <= 10_000, text]
            else
              [false, nil]
            end
          end
        end

        def self.validate_row(table, input, mode)
          Rt.fail!(400, "invalid_input") unless input.is_a?(Hash)
          clean = {}
          bad = {}
          table["columns"].each do |c| # only columns of the schema are ever read: no mass assignment
            name = c["name"]
            if !input.key?(name)
              bad[name] = "required" if mode == "full" && !c["nullable"] && !c["auto"] && !c["primary"] && c["default"].to_s.empty?
            elsif input[name].nil?
              c["nullable"] ? clean[name] = nil : bad[name] = "required"
            else
              ok, value = coerce(c["kind"], input[name])
              ok ? clean[name] = value : bad[name] = "invalid"
            end
          end
          raise Rt::ApiError.new(400, "invalid_input", bad) unless bad.empty?
          clean
        end

        # True when no primary key or unique column holds the same value twice.
        def self.unique?(table, rows)
          table["columns"].all? do |c|
            next true unless c["primary"] || c["unique"]
            keys = rows.map { |r| r[c["name"]] }.compact.map { |v| Rt.to_text(v) }
            keys.uniq.length == keys.length
          end
        end

        def self.same?(a, b) = !a.nil? && Rt.to_text(a) == Rt.to_text(b)

        def self.next_key(rows, c)
          return Rt.new_id unless c["kind"] == "int"
          (rows.filter_map { |r| Rt.to_float(r[c["name"]]) }.max || 0).to_i + 1
        end

        def self.validate(name, input, mode) = validate_row(table(name), input, mode)

        # The rows whose column equals the value (at most 1000). No value means all rows.
        def self.find(name, column, value)
          t = table(name)
          col = resolve(t, column)
          @lock.synchronize { @data[name].select { |r| value.nil? || same?(r[col], value) }.first(1000).map(&:dup) }
        end

        def self.insert(name, values)
          t = table(name)
          row = validate_row(t, values, "full")
          @lock.synchronize do
            rows = @data[name]
            t["columns"].each do |c|
              next if row.key?(c["name"])
              row[c["name"]] = nil
              if c["primary"] || c["auto"]
                row[c["name"]] = next_key(rows, c)
              elsif !c["default"].to_s.empty?
                if c["kind"] == "date" && %w[now() now current_timestamp].include?(c["default"].to_s.downcase)
                  row[c["name"]] = Rt.now
                else
                  ok, value = coerce(c["kind"], c["default"])
                  row[c["name"]] = value if ok
                end
              end
            end
            candidate = rows + [row]
            Rt.fail!(409, "conflict") unless unique?(t, candidate)
            @data[name] = candidate
            save
            row.dup
          end
        end

        # Changes the rows that match. The primary key is never changed. No value matches nothing.
        def self.update(name, column, value, values)
          t = table(name)
          col = resolve(t, column)
          clean = validate_row(t, values, "partial")
          clean.delete(t["primary"])
          return [] if value.nil?
          @lock.synchronize do
            changed = []
            candidate = @data[name].map do |r|
              next r unless same?(r[col], value)
              merged = r.merge(clean)
              changed << merged.dup
              merged
            end
            unless changed.empty?
              Rt.fail!(409, "conflict") unless unique?(t, candidate)
              @data[name] = candidate
              save
            end
            changed
          end
        end

        # Deletes the rows that match and returns how many. No value deletes nothing.
        def self.remove(name, column, value)
          t = table(name)
          col = resolve(t, column)
          return 0 if value.nil?
          @lock.synchronize do
            kept = @data[name].reject { |r| same?(r[col], value) }
            removed = @data[name].length - kept.length
            if removed.positive?
              @data[name] = kept
              save
            end
            removed
          end
        end
      end
