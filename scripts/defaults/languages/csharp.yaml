# C#: ASP.NET Core minimal API (.NET 8) with the built-in WebSocket support. No NuGet packages needed. See docs/FORMATS.md section 2.
id: csharp
name: C# (ASP.NET Core)
description: A minimal API on Kestrel. WebSockets are built into the framework, so there are no extra packages.
capabilities: [rest, websocket]
runtime: ".NET 8 SDK"
runCommand: "dotnet run"
stringStyle: default
indent: "    "
literals: { null: "null", true: "true", false: "false", object: "new JsonObject()", list: "new JsonArray()" }
declare: "object? {{name}} = {{expr}};"
usedMarker: "_ = {{name}};"
dependencies: []
dependencyFormat: '    <PackageReference Include="{{name}}" Version="{{version}}" />'
devDependencyFormat: '    <PackageReference Include="{{name}}" Version="{{version}}" />'
dependencySeparator: "\n"
packages:
  - id: access-log
    name: Access log
    description: Writes one line per request to the console (method, path, status)
    imports: []
    setup:
      - |
        app.Use(async (context, next) =>
        {
            await next();
            Rt.Log("info", context.Request.Method + " " + context.Request.Path + " " + context.Response.StatusCode);
        });
  - id: hsts
    name: HSTS header
    description: Tells browsers to use HTTPS only. Turn on when the API sits behind HTTPS.
    imports: []
    setup:
      - |
        app.Use(async (context, next) =>
        {
            context.Response.Headers["Strict-Transport-Security"] = "max-age=63072000; includeSubDomains";
            await next();
        });
  - id: request-id
    name: Request id
    description: Adds an X-Request-Id header to every answer, so a problem can be found in the logs
    imports: []
    setup:
      - |
        app.Use(async (context, next) =>
        {
            context.Response.Headers["X-Request-Id"] = Guid.NewGuid().ToString("N");
            await next();
        });
websocket:
  imports: []
  setup: |
    WsRt.Mount(app, async (WsConn ws, string eventName, Req req) =>
    {
        switch (eventName)
        {
            {{wsHandlers}}
            default:
                await WsRt.Send(ws, "error", Rt.Obj("error", "unknown_event"));
                break;
        }
    });
files:
  - path: "{{appPascal}}.csproj"
    template: |
      <Project Sdk="Microsoft.NET.Sdk.Web">
        <PropertyGroup>
          <TargetFramework>net8.0</TargetFramework>
          <Nullable>enable</Nullable>
          <ImplicitUsings>enable</ImplicitUsings>
          <InvariantGlobalization>true</InvariantGlobalization>
          <NoWarn>CS0162;CS1998;CS8321</NoWarn>
        </PropertyGroup>
        <ItemGroup>
      {{dependencies}}
        </ItemGroup>
      </Project>
  - path: Program.cs
    template: |
      // {{appName}}: generated by Cosmos-Scintillation. Settings come from .env (see README.md).
      using System.Net;
      using System.Text.Json.Nodes;
      {{imports}}

      var cfg = Rt.LoadConfig({{requireApiKey}}, {{port}}, {{maxBodyKb}}, {{rateLimit}});
      Store.Open(cfg.DataDir, {{schemaJson}});

      var builder = WebApplication.CreateSlimBuilder(args);
      builder.WebHost.ConfigureKestrel(options =>
      {
          options.AddServerHeader = false;
          options.Limits.MaxRequestBodySize = cfg.MaxBody;
          options.Limits.MaxRequestHeaderCount = 100;
          options.Limits.RequestHeadersTimeout = TimeSpan.FromSeconds(Math.Min(cfg.TimeoutSeconds, 10));
          options.Limits.KeepAliveTimeout = TimeSpan.FromSeconds(5);
          options.Listen(IPAddress.Parse(cfg.Host), cfg.Port);
      });

      var app = builder.Build();
      app.UseRouting();
      app.Use(Rt.Secure(cfg));
      {{setup}}

      {{routes}}

      {{wsSetup}}

      app.MapFallback(() => Results.Json(new { error = "not_found" }, statusCode: 404));
      Console.WriteLine("listening on http://" + cfg.Host + ":" + cfg.Port);
      app.Run();
  - path: Rt.cs
    template: |
      // The runtime of the generated API: settings, security and the small helpers the script nodes call.
      using System.Collections.Concurrent;
      using System.Globalization;
      using System.Security.Cryptography;
      using System.Text;
      using System.Text.Json;
      using System.Text.Json.Nodes;

      public sealed class Config
      {
          public bool Auth;
          public string Host = "127.0.0.1";
          public int Port;
          public long MaxBody;
          public int RateLimit;
          public string ApiKey = "";
          public int TimeoutSeconds = 15;
          public string DataDir = "data";
          public HashSet<string> Origins = new(StringComparer.OrdinalIgnoreCase);
      }

      /// <summary>What a route handler returns: a status and an optional JSON body.</summary>
      public sealed record Reply(int Status, JsonNode? Body);

      /// <summary>A problem the caller should hear about. Anything else becomes a plain 500.</summary>
      public sealed class ApiError : Exception
      {
          public int Status;
          public string Code;
          public JsonNode? Details;
          public ApiError(int status, string code, JsonNode? details = null) : base(code)
          {
              Status = status;
              Code = code;
              Details = details;
          }
      }

      /// <summary>The request as the script sees it: body, query, path parameters and headers.</summary>
      public sealed class Req
      {
          public JsonNode? Body;
          public Dictionary<string, string> Query = new();
          public Dictionary<string, string> Params = new();
          public Dictionary<string, string> Headers = new(StringComparer.OrdinalIgnoreCase);
          public static Req ForMessage(JsonNode? data) => new Req { Body = data };
      }

      public sealed class AuthMark
      {
          public bool Required;
      }

      public static class Rt
      {
          static Config cfg = new();
          static readonly ConcurrentDictionary<string, (long Window, int Count)> hits = new();

          // === Settings === //

          static Dictionary<string, string> ReadEnvFile()
          {
              var values = new Dictionary<string, string>();
              if (!File.Exists(".env")) return values;
              foreach (var raw in File.ReadAllLines(".env"))
              {
                  var line = raw.Trim();
                  if (line.Length == 0 || line[0] == '#') continue;
                  var at = line.IndexOf('=');
                  if (at > 0) values[line[..at].Trim()] = line[(at + 1)..].Trim().Trim('"');
              }
              return values;
          }

          public static Config LoadConfig(bool auth, int port, int maxBodyKb, int rateLimit)
          {
              var file = ReadEnvFile();
              string Get(string key, string fallback) => Environment.GetEnvironmentVariable(key) ?? (file.TryGetValue(key, out var v) ? v : fallback);
              int Num(string key, int fallback, int min, int max) => int.TryParse(Get(key, ""), out var n) ? System.Math.Clamp(n, min, max) : fallback;

              cfg = new Config
              {
                  Auth = auth,
                  Host = Get("HOST", "127.0.0.1"),
                  Port = Num("PORT", port, 1, 65535),
                  MaxBody = Num("MAX_BODY_KB", maxBodyKb, 1, 102400) * 1024L,
                  RateLimit = Num("RATE_LIMIT_PER_MIN", rateLimit, 0, 1000000),
                  ApiKey = Get("API_KEY", ""),
                  TimeoutSeconds = Num("REQUEST_TIMEOUT_SECONDS", 15, 1, 300),
                  DataDir = Get("DATA_DIR", "data")
              };
              foreach (var origin in Get("ALLOWED_ORIGINS", "").Split(',', StringSplitOptions.RemoveEmptyEntries | StringSplitOptions.TrimEntries))
                  cfg.Origins.Add(origin);
              if (cfg.Auth && cfg.ApiKey.Length == 0)
              {
                  Console.Error.WriteLine("API_KEY is empty but the API needs a key. Set API_KEY in .env, then start again.");
                  Environment.Exit(1);
              }
              return cfg;
          }

          // === Security === //

          public static bool OriginAllowed(string origin) => cfg.Origins.Contains(origin);
          public static bool RequiresKey => cfg.Auth;
          public static long MaxBodyBytes => cfg.MaxBody;
          public static int RateLimitPerMinute => cfg.RateLimit;

          /// <summary>Compares the keys by their hashes, so the time taken does not tell how much of the key was right.</summary>
          public static bool KeyOk(string? given)
          {
              if (given is null) return false;
              var a = SHA256.HashData(Encoding.UTF8.GetBytes(given));
              var b = SHA256.HashData(Encoding.UTF8.GetBytes(cfg.ApiKey));
              return CryptographicOperations.FixedTimeEquals(a, b);
          }

          static bool RateOk(string client)
          {
              if (cfg.RateLimit <= 0) return true;
              var minute = DateTimeOffset.UtcNow.ToUnixTimeSeconds() / 60;
              if (hits.Count > 10000) hits.Clear();
              var entry = hits.AddOrUpdate(client, (minute, 1), (_, old) => old.Window == minute ? (minute, old.Count + 1) : (minute, 1));
              return entry.Count <= cfg.RateLimit;
          }

          static Task Fail(HttpContext context, int status, string code)
          {
              context.Response.StatusCode = status;
              context.Response.ContentType = "application/json";
              return context.Response.WriteAsync("{\"error\":\"" + code + "\"}");
          }

          /// <summary>Headers, CORS allow-list, rate limit and API key, in front of every route.</summary>
          public static Func<HttpContext, Func<Task>, Task> Secure(Config c)
          {
              cfg = c;
              return async (context, next) =>
              {
                  var h = context.Response.Headers;
                  h["X-Content-Type-Options"] = "nosniff";
                  h["X-Frame-Options"] = "DENY";
                  h["Referrer-Policy"] = "no-referrer";
                  h["Content-Security-Policy"] = "default-src 'none'; frame-ancestors 'none'";
                  h["Cache-Control"] = "no-store";

                  var origin = context.Request.Headers.Origin.ToString();
                  if (origin.Length > 0 && OriginAllowed(origin))
                  {
                      h["Access-Control-Allow-Origin"] = origin;
                      h["Vary"] = "Origin";
                      h["Access-Control-Allow-Headers"] = "Content-Type, X-API-Key";
                      h["Access-Control-Allow-Methods"] = "GET, POST, PUT, PATCH, DELETE, OPTIONS";
                  }
                  if (HttpMethods.IsOptions(context.Request.Method))
                  {
                      context.Response.StatusCode = origin.Length > 0 && !OriginAllowed(origin) ? 403 : 204;
                      return;
                  }

                  var client = context.Connection.RemoteIpAddress?.ToString() ?? "unknown";
                  if (!RateOk(client)) { await Fail(context, 429, "rate_limited"); return; }

                  var mark = context.GetEndpoint()?.Metadata.GetMetadata<AuthMark>();
                  if (mark is { Required: true } && cfg.Auth && !KeyOk(context.Request.Headers["X-API-Key"].ToString()))
                  {
                      await Fail(context, 401, "unauthorized");
                      return;
                  }
                  await next();
              };
          }

          public static void Log(string level, object? message)
          {
              var text = (Text(message, "trim") ?? "").ToString() ?? "";
              text = text.Replace('\r', ' ').Replace('\n', ' ');
              if (text.Length > 500) text = text[..500];
              var tag = level == "error" ? "ERROR" : level == "warn" ? "WARN" : "INFO";
              Console.WriteLine(DateTime.UtcNow.ToString("O") + " [" + tag + "] " + text);
          }

          // === Routes === //

          public static void Route(WebApplication app, string method, string path, bool auth, Func<Req, Reply> handler)
          {
              app.MapMethods(path, new[] { method }, async (HttpContext context) =>
              {
                  try
                  {
                      var req = new Req();
                      foreach (var q in context.Request.Query) req.Query[q.Key] = q.Value.ToString();
                      foreach (var r in context.Request.RouteValues) req.Params[r.Key] = Convert.ToString(r.Value, CultureInfo.InvariantCulture) ?? "";
                      foreach (var hd in context.Request.Headers) req.Headers[hd.Key] = hd.Value.ToString();
                      req.Body = await ReadBody(context);

                      var reply = handler(req);
                      context.Response.StatusCode = reply.Status;
                      if (reply.Body is null || reply.Status == 204) return;
                      context.Response.ContentType = "application/json";
                      await context.Response.WriteAsync(reply.Body.ToJsonString());
                  }
                  catch (ApiError error)
                  {
                      await WriteError(context, error);
                  }
                  catch (Exception exception)
                  {
                      Log("error", exception.GetType().Name);
                      await WriteError(context, new ApiError(500, "internal_error"));
                  }
              }).WithMetadata(new AuthMark { Required = auth });
          }

          static async Task WriteError(HttpContext context, ApiError error)
          {
              if (context.Response.HasStarted) return;
              context.Response.StatusCode = error.Status;
              context.Response.ContentType = "application/json";
              var body = new JsonObject { ["error"] = error.Code };
              if (error.Details is not null) body["details"] = error.Details;
              await context.Response.WriteAsync(body.ToJsonString());
          }

          static async Task<JsonNode?> ReadBody(HttpContext context)
          {
              var length = context.Request.ContentLength;
              if (length is null or 0 && !context.Request.Headers.ContainsKey("Transfer-Encoding")) return null;
              if (length > cfg.MaxBody) throw new ApiError(413, "payload_too_large");

              using var buffer = new MemoryStream();
              var chunk = new byte[8192];
              int read;
              while ((read = await context.Request.Body.ReadAsync(chunk)) > 0)
              {
                  if (buffer.Length + read > cfg.MaxBody) throw new ApiError(413, "payload_too_large");
                  buffer.Write(chunk, 0, read);
              }
              if (buffer.Length == 0) return null;
              try { return JsonNode.Parse(buffer.ToArray()); }
              catch (JsonException) { throw new ApiError(400, "invalid_json"); }
          }

          public static Reply Send(int status, object? body) => new Reply(status, J(body));

          // === Values: everything a script handles is a JSON value (JsonNode), a string, a number or a bool === //

          public static JsonNode? J(object? value) => value switch
          {
              null => null,
              JsonNode node => node.DeepClone(),
              string s => JsonValue.Create(s),
              bool b => JsonValue.Create(b),
              int i => JsonValue.Create(i),
              long l => JsonValue.Create(l),
              double d => JsonValue.Create(d),
              float f => JsonValue.Create((double)f),
              decimal m => JsonValue.Create(m),
              _ => JsonValue.Create(Convert.ToString(value, CultureInfo.InvariantCulture))
          };

          public static string ToText(object? value)
          {
              var node = value as JsonNode ?? J(value);
              if (node is null) return "";
              if (node is JsonValue v)
              {
                  if (v.TryGetValue<string>(out var s)) return s;
                  return v.ToJsonString().Trim('"');
              }
              return node.ToJsonString();
          }

          public static double? ToNumber(object? value)
          {
              var node = value as JsonNode ?? J(value);
              if (node is JsonValue v)
              {
                  if (v.TryGetValue<double>(out var d)) return d;
                  if (v.TryGetValue<long>(out var l)) return l;
                  if (v.TryGetValue<string>(out var s) && double.TryParse(s, NumberStyles.Float, CultureInfo.InvariantCulture, out var parsed)) return parsed;
              }
              return null;
          }

          static object Num(double value) => value == System.Math.Floor(value) && System.Math.Abs(value) < 9e15 ? (object)(long)value : value;

          public static bool Truthy(object? value)
          {
              var node = value as JsonNode ?? J(value);
              if (node is null) return false;
              if (node is JsonValue v)
              {
                  if (v.TryGetValue<bool>(out var b)) return b;
                  if (v.TryGetValue<string>(out var s)) return s.Length > 0 && !s.Equals("false", StringComparison.OrdinalIgnoreCase);
                  var n = ToNumber(v);
                  return n is not null && n != 0;
              }
              return true;
          }

          // === Request access === //

          public static object? Body(Req req, string key) => Field(req.Body, key);
          public static object? Query(Req req, string key) => req.Query.TryGetValue(key, out var v) ? v : null;
          public static object? Param(Req req, string key) => req.Params.TryGetValue(key, out var v) ? v : null;
          public static object? Header(Req req, string key) => req.Headers.TryGetValue(key, out var v) ? v : null;
          public static object? OrBody(Req req, object? values) => values ?? req.Body;

          public static object? Field(object? obj, string key) => obj is JsonObject o && o.TryGetPropertyValue(key, out var v) ? v?.DeepClone() : null;

          public static object? Obj(params object?[] pairs)
          {
              var result = new JsonObject();
              for (var i = 0; i + 1 < pairs.Length; i += 2)
              {
                  var key = pairs[i]?.ToString() ?? "";
                  if (key.Length == 0) continue;
                  result[key] = J(pairs[i + 1]);
              }
              return result;
          }

          public static object? First(object? rows) => rows is JsonArray a && a.Count > 0 ? a[0]?.DeepClone() : null;
          public static object Count(object? rows) => rows is JsonArray a ? a.Count : 0;

          // === Logic, text and math === //

          public static object Cmp(object? a, string op, object? b)
          {
              var x = ToNumber(a);
              var y = ToNumber(b);
              var numeric = x is not null && y is not null && (op is "lt" or "le" or "gt" or "ge" || (a is not string && b is not string));
              int order = numeric ? x!.Value.CompareTo(y!.Value) : string.CompareOrdinal(ToText(a), ToText(b));
              return op switch
              {
                  "eq" => order == 0,
                  "ne" => order != 0,
                  "lt" => order < 0,
                  "le" => order <= 0,
                  "gt" => order > 0,
                  "ge" => order >= 0,
                  "contains" => ToText(a).Contains(ToText(b), StringComparison.Ordinal),
                  "startsWith" => ToText(a).StartsWith(ToText(b), StringComparison.Ordinal),
                  _ => false
              };
          }

          public static object Logic(object? a, string op, object? b) => op switch
          {
              "and" => Truthy(a) && Truthy(b),
              "or" => Truthy(a) || Truthy(b),
              "not" => !Truthy(a),
              _ => false
          };

          public static object Concat(object? a, object? b, string separator) => ToText(a) + separator + ToText(b);

          public static object? Text(object? value, string op)
          {
              var text = ToText(value);
              return op switch
              {
                  "upper" => text.ToUpperInvariant(),
                  "lower" => text.ToLowerInvariant(),
                  "length" => text.Length,
                  _ => text.Trim()
              };
          }

          public static object? Math(object? a, string op, object? b)
          {
              var x = ToNumber(a) ?? 0;
              var y = ToNumber(b) ?? 0;
              switch (op)
              {
                  case "add": return Num(x + y);
                  case "sub": return Num(x - y);
                  case "mul": return Num(x * y);
                  case "div": return y == 0 ? null : Num(x / y);
                  case "mod": return y == 0 ? null : Num(x % y);
                  case "min": return Num(System.Math.Min(x, y));
                  case "max": return Num(System.Math.Max(x, y));
                  default: return null;
              }
          }

          public static object Now() => DateTime.UtcNow.ToString("O");
          public static object NewId() => Guid.NewGuid().ToString();
      }
  - path: Store.cs
    template: |
      // A small data store for the generated API: tables in memory, saved to data/store.json.
      // It only knows the tables and columns of the schema, so a request can never add or change anything else.
      using System.Text.Json;
      using System.Text.Json.Nodes;

      public static class Store
      {
          sealed record Column(string Name, string Kind, bool Primary, bool Unique, bool Nullable, bool Auto, string Default);
          sealed record Table(string Name, string Primary, List<Column> Columns);

          static readonly Dictionary<string, Table> tables = new();
          static readonly Dictionary<string, JsonArray> data = new();
          static readonly object gate = new();
          static string file = "";

          /// <summary>Reads the schema (JSON text made by the exporter) and the saved rows.</summary>
          public static void Open(string dir, string schema)
          {
              lock (gate)
              {
                  var root = JsonNode.Parse(schema) as JsonObject;
                  foreach (var node in root?["tables"] as JsonArray ?? new JsonArray())
                  {
                      if (node is not JsonObject t) continue;
                      var columns = new List<Column>();
                      foreach (var c in t["columns"] as JsonArray ?? new JsonArray())
                      {
                          if (c is not JsonObject o) continue;
                          columns.Add(new Column(
                              o["name"]?.GetValue<string>() ?? "", o["kind"]?.GetValue<string>() ?? "string",
                              Flag(o, "primary"), Flag(o, "unique"), Flag(o, "nullable"), Flag(o, "auto"), o["default"]?.GetValue<string>() ?? ""));
                      }
                      var name = t["name"]?.GetValue<string>() ?? "";
                      var primary = columns.FirstOrDefault(c => c.Primary)?.Name ?? "";
                      tables[name] = new Table(name, primary, columns);
                      data[name] = new JsonArray();
                  }

                  file = Path.Combine(dir, "store.json");
                  if (!File.Exists(file)) return;
                  try
                  {
                      if (JsonNode.Parse(File.ReadAllText(file)) is JsonObject saved)
                          foreach (var pair in saved)
                              if (tables.ContainsKey(pair.Key) && pair.Value is JsonArray rows)
                                  data[pair.Key] = (JsonArray)rows.DeepClone();
                  }
                  catch (JsonException)
                  {
                      // an unreadable file starts a fresh store
                  }
              }
          }

          static bool Flag(JsonObject o, string key) => o[key] is JsonValue v && v.TryGetValue<bool>(out var b) && b;

          static void Save()
          {
              try
              {
                  Directory.CreateDirectory(Path.GetDirectoryName(Path.GetFullPath(file))!);
                  var all = new JsonObject();
                  foreach (var pair in data) all[pair.Key] = pair.Value.DeepClone();
                  File.WriteAllText(file + ".tmp", all.ToJsonString());
                  File.Move(file + ".tmp", file, true);
              }
              catch (IOException)
              {
                  throw new ApiError(500, "internal_error");
              }
          }

          static Table Get(string name) => tables.TryGetValue(name, out var t) ? t : throw new ApiError(500, "internal_error"); // names come from the script, never from a request

          /// <summary>The column to match on: the named one, else the primary key, else the first column.</summary>
          static string Resolve(Table table, string name)
          {
              if (name.Length == 0) return table.Primary.Length > 0 ? table.Primary : table.Columns[0].Name;
              return table.Columns.Any(c => c.Name == name) ? name : throw new ApiError(500, "internal_error");
          }

          static bool Coerce(string kind, JsonNode value, out JsonNode? result)
          {
              result = null;
              var v = value as JsonValue;
              switch (kind)
              {
                  case "int":
                  {
                      if (v is null || (v.TryGetValue<bool>(out _))) return false;
                      var n = Rt.ToNumber(v);
                      if (n is null || n != System.Math.Floor(n.Value) || System.Math.Abs(n.Value) > 9e15) return false;
                      result = JsonValue.Create((long)n.Value);
                      return true;
                  }
                  case "float":
                  {
                      var n = v is null || v.TryGetValue<bool>(out _) ? null : Rt.ToNumber(v);
                      if (n is null) return false;
                      result = JsonValue.Create(n.Value);
                      return true;
                  }
                  case "bool":
                  {
                      if (v is null) return false;
                      if (v.TryGetValue<bool>(out var b)) { result = JsonValue.Create(b); return true; }
                      var text = Rt.ToText(v).ToLowerInvariant();
                      if (text is "true" or "false") { result = JsonValue.Create(text == "true"); return true; }
                      var n = Rt.ToNumber(v);
                      if (n is 0 or 1) { result = JsonValue.Create(n == 1); return true; }
                      return false;
                  }
                  case "json":
                      result = value.DeepClone();
                      return true;
              }
              if (v is null) return false;
              var s = Rt.ToText(v);
              if (s.Length > 10000) return false;
              result = JsonValue.Create(s);
              return true;
          }

          /// <summary>Keeps only the columns of the schema and checks their types. Throws 400 with the list of bad fields.</summary>
          public static object? Validate(string name, object? input, string mode)
          {
              var table = Get(name);
              if (input is not JsonObject given) throw new ApiError(400, "invalid_input");
              var clean = new JsonObject();
              var bad = new JsonObject();
              foreach (var c in table.Columns) // only columns of the schema are ever read: no mass assignment
              {
                  if (!given.TryGetPropertyValue(c.Name, out var raw))
                  {
                      if (mode == "full" && !c.Nullable && !c.Auto && !c.Primary && c.Default.Length == 0) bad[c.Name] = "required";
                      continue;
                  }
                  if (raw is null)
                  {
                      if (c.Nullable) clean[c.Name] = null; else bad[c.Name] = "required";
                      continue;
                  }
                  if (Coerce(c.Kind, raw, out var value)) clean[c.Name] = value; else bad[c.Name] = "invalid";
              }
              if (bad.Count > 0) throw new ApiError(400, "invalid_input", bad);
              return clean;
          }

          static bool Same(JsonNode? a, object? b) => a is not null && Rt.ToText(a) == Rt.ToText(b);

          static bool UniqueOk(Table table, JsonArray rows)
          {
              foreach (var c in table.Columns.Where(c => c.Primary || c.Unique))
              {
                  var seen = new HashSet<string>();
                  foreach (var row in rows)
                  {
                      var v = row?[c.Name];
                      if (v is null) continue;
                      if (!seen.Add(Rt.ToText(v))) return false;
                  }
              }
              return true;
          }

          static JsonNode NextKey(JsonArray rows, Column c)
          {
              if (c.Kind != "int") return JsonValue.Create(Guid.NewGuid().ToString())!;
              double highest = 0;
              foreach (var r in rows)
              {
                  var n = Rt.ToNumber(r?[c.Name]);
                  if (n is not null && n > highest) highest = n.Value;
              }
              return JsonValue.Create((long)highest + 1)!;
          }

          // === What the script nodes call === //

          public static object? Find(string name, string column, object? value)
          {
              lock (gate)
              {
                  var table = Get(name);
                  var by = Resolve(table, column);
                  var found = new JsonArray();
                  foreach (var row in data[name]) if (Same(row?[by], value)) found.Add(row!.DeepClone());
                  return found;
              }
          }

          public static object? Insert(string name, object? input)
          {
              lock (gate)
              {
                  var table = Get(name);
                  var row = (JsonObject)Validate(name, input, "full")!;
                  foreach (var c in table.Columns)
                  {
                      if (row.ContainsKey(c.Name)) continue;
                      if (c.Auto || (c.Primary && c.Default.Length == 0)) row[c.Name] = NextKey(data[name], c);
                      else if (c.Default.Length > 0 && Coerce(c.Kind, JsonValue.Create(c.Default)!, out var def)) row[c.Name] = def;
                      else row[c.Name] = null;
                  }
                  var copy = (JsonArray)data[name].DeepClone();
                  copy.Add(row.DeepClone());
                  if (!UniqueOk(table, copy)) throw new ApiError(409, "conflict");
                  data[name].Add(row.DeepClone());
                  Save();
                  return row;
              }
          }

          public static object? Update(string name, string column, object? value, object? input)
          {
              lock (gate)
              {
                  var table = Get(name);
                  var by = Resolve(table, column);
                  var changes = (JsonObject)Validate(name, input, "partial")!;
                  var copy = (JsonArray)data[name].DeepClone();
                  var updated = new JsonArray();
                  foreach (var row in copy)
                  {
                      if (row is not JsonObject r || !Same(r[by], value)) continue;
                      foreach (var pair in changes) r[pair.Key] = pair.Value?.DeepClone();
                      updated.Add(r.DeepClone());
                  }
                  if (updated.Count == 0) return updated;
                  if (!UniqueOk(table, copy)) throw new ApiError(409, "conflict");
                  data[name] = copy;
                  Save();
                  return updated;
              }
          }

          public static object Remove(string name, string column, object? value)
          {
              lock (gate)
              {
                  var table = Get(name);
                  var by = Resolve(table, column);
                  var keep = new JsonArray();
                  var removed = 0;
                  foreach (var row in data[name])
                  {
                      if (Same(row?[by], value)) removed++; else keep.Add(row!.DeepClone());
                  }
                  if (removed > 0)
                  {
                      data[name] = keep;
                      Save();
                  }
                  return removed;
              }
          }
      }
  - path: WsRt.cs
    when: websocket
    template: |
      // WebSocket support: origin, key, message size and message rate are checked before a handler runs.
      using System.Collections.Concurrent;
      using System.Net.WebSockets;
      using System.Text;
      using System.Text.Json.Nodes;

      public sealed class WsConn
      {
          public readonly WebSocket Socket;
          public readonly SemaphoreSlim Gate = new(1, 1);
          public WsConn(WebSocket socket) { Socket = socket; }
      }

      public static class WsRt
      {
          static readonly ConcurrentDictionary<WsConn, byte> clients = new();
          const int MaxClients = 1000;

          static async Task Raw(WsConn ws, string text)
          {
              if (ws.Socket.State != WebSocketState.Open) return;
              await ws.Gate.WaitAsync();
              try { await ws.Socket.SendAsync(Encoding.UTF8.GetBytes(text), WebSocketMessageType.Text, true, CancellationToken.None); }
              catch (Exception) { /* the client went away */ }
              finally { ws.Gate.Release(); }
          }

          public static Task Send(WsConn ws, string eventName, object? data)
          {
              var message = new JsonObject { ["event"] = eventName, ["data"] = Rt.J(data) };
              return Raw(ws, message.ToJsonString());
          }

          /// <summary>Sends to every other client, or to all of them (including the sender) when `to` is "all".</summary>
          public static async Task Broadcast(WsConn ws, string eventName, object? data, string to)
          {
              foreach (var other in clients.Keys)
                  if (other != ws || to == "all") await Send(other, eventName, data);
          }

          /// <summary>Accepts connections on /ws. Only JSON text messages {"event": "...", "data": ...} are handled.</summary>
          public static void Mount(WebApplication app, Func<WsConn, string, Req, Task> dispatch)
          {
              app.UseWebSockets(new WebSocketOptions { KeepAliveInterval = TimeSpan.FromSeconds(30) });
              app.Map("/ws", async (HttpContext context) =>
              {
                  if (!context.WebSockets.IsWebSocketRequest) { context.Response.StatusCode = 400; return; }
                  var origin = context.Request.Headers.Origin.ToString();
                  if (origin.Length > 0 && !Rt.OriginAllowed(origin)) { context.Response.StatusCode = 403; return; }
                  var key = context.Request.Headers["X-API-Key"].ToString();
                  if (key.Length == 0) key = context.Request.Query["key"].ToString();
                  if (Rt.RequiresKey && !Rt.KeyOk(key)) { context.Response.StatusCode = 401; return; }
                  if (clients.Count >= MaxClients) { context.Response.StatusCode = 503; return; }

                  using var socket = await context.WebSockets.AcceptWebSocketAsync();
                  var ws = new WsConn(socket);
                  clients[ws] = 0;
                  var windowStart = DateTime.UtcNow;
                  var messages = 0;
                  var buffer = new byte[8192];
                  try
                  {
                      while (socket.State == WebSocketState.Open)
                      {
                          using var message = new MemoryStream();
                          WebSocketReceiveResult result;
                          do
                          {
                              result = await socket.ReceiveAsync(buffer, CancellationToken.None);
                              if (result.MessageType == WebSocketMessageType.Close) break;
                              message.Write(buffer, 0, result.Count);
                              if (message.Length > Rt.MaxBodyBytes)
                              {
                                  await socket.CloseAsync(WebSocketCloseStatus.MessageTooBig, "too_big", CancellationToken.None);
                                  return;
                              }
                          } while (!result.EndOfMessage);
                          if (result.MessageType == WebSocketMessageType.Close) break;

                          if ((DateTime.UtcNow - windowStart).TotalSeconds >= 60) { windowStart = DateTime.UtcNow; messages = 0; }
                          messages++;
                          if (Rt.RateLimitPerMinute > 0 && messages > Rt.RateLimitPerMinute)
                          {
                              await socket.CloseAsync(WebSocketCloseStatus.PolicyViolation, "rate_limited", CancellationToken.None);
                              return;
                          }

                          JsonObject? parsed = null;
                          if (result.MessageType == WebSocketMessageType.Text)
                          {
                              try { parsed = JsonNode.Parse(message.ToArray()) as JsonObject; } catch (System.Text.Json.JsonException) { }
                          }
                          var name = parsed?["event"] is JsonValue v && v.TryGetValue<string>(out var s) ? s : "";
                          if (parsed is null || name.Length == 0)
                          {
                              await Send(ws, "error", Rt.Obj("error", "invalid_message"));
                              continue;
                          }
                          try { await dispatch(ws, name, Req.ForMessage(parsed["data"]?.DeepClone())); }
                          catch (ApiError error) { await Send(ws, "error", Rt.Obj("error", error.Code)); }
                          catch (Exception exception)
                          {
                              Rt.Log("error", exception.GetType().Name);
                              await Send(ws, "error", Rt.Obj("error", "internal_error"));
                          }
                      }
                  }
                  catch (WebSocketException) { /* the client went away */ }
                  finally { clients.TryRemove(ws, out _); }
              });
          }
      }
