# Python: FastAPI + uvicorn (WebSockets through Starlette). See docs/FORMATS.md section 2.
id: python
name: Python (FastAPI)
description: FastAPI served by uvicorn. Script nodes become plain functions, WebSocket events become async functions.
capabilities: [rest, websocket]
runtime: "Python 3.10+"
runCommand: "pip install -r requirements.txt && python main.py"
stringStyle: default
indent: "    "
literals: { null: "None", true: "True", false: "False", object: "{}", list: "[]" }
declare: "{{name}} = {{expr}}"
usedMarker: "_ = {{name}}"
dependencies:
  - { name: fastapi, version: "0.115.5" }
  - { name: "uvicorn[standard]", version: "0.32.1" }
dependencyFormat: "{{name}}=={{version}}"
devDependencyFormat: "{{name}}=={{version}}"
dependencySeparator: "\n"
packages:
  - id: compression
    name: Compression
    description: gzip answers with Starlette's GZipMiddleware
    imports: [ "from starlette.middleware.gzip import GZipMiddleware" ]
    setup: [ "app.add_middleware(GZipMiddleware, minimum_size=500)" ]
  - id: access-log
    name: Access log
    description: Writes one line per request to the console (method, path, status, milliseconds)
    imports: [ "import time" ]
    setup:
      - |
        @app.middleware("http")
        async def access_log(request, call_next):
            started = time.monotonic()
            response = await call_next(request)
            rt.log("info", f"{request.method} {request.url.path} {response.status_code} {(time.monotonic() - started) * 1000:.1f}ms")
            return response
  - id: hsts
    name: HSTS header
    description: Tells browsers to use HTTPS only. Turn on when the API sits behind HTTPS.
    imports: []
    setup:
      - |
        @app.middleware("http")
        async def hsts(request, call_next):
            response = await call_next(request)
            response.headers["Strict-Transport-Security"] = "max-age=63072000; includeSubDomains"
            return response
  - id: request-id
    name: Request id
    description: Adds an X-Request-Id header (a fresh random id) to every answer, handy for support requests
    imports: [ "import uuid" ]
    setup:
      - |
        @app.middleware("http")
        async def request_id(request, call_next):
            response = await call_next(request)
            response.headers["X-Request-Id"] = str(uuid.uuid4())
            return response
websocket:
  imports: [ "import wsrt" ]
  setup: |
    ws_event = wsrt.attach(app, cfg)
    {{wsHandlers}}
files:
  - path: requirements.txt
    template: |
      {{dependencies}}
  - path: main.py
    template: |
      # {{appName}}: generated by Cosmos-Scintillation. Settings come from .env (see README.md).
      from fastapi import FastAPI

      import rt
      import store
      {{wsImports}}
      {{imports}}

      cfg = rt.load_config({{requireApiKey}}, {{port}}, {{maxBodyKb}}, {{rateLimit}})
      store.open(cfg.data_dir, {{schemaJson}})

      app = FastAPI(docs_url=None, redoc_url=None, openapi_url=None)
      rt.secure(app, cfg)
      {{setup}}
      route = rt.router(app, cfg)

      {{routes}}

      {{wsSetup}}

      if __name__ == "__main__":
          import uvicorn

          uvicorn.run(
              app,
              host=cfg.host,
              port=cfg.port,
              server_header=False,
              proxy_headers=False,
              access_log=False,
              timeout_keep_alive=5,
              ws_max_size=cfg.max_body,
          )
  - path: rt.py
    template: |
      """The runtime of the generated API: settings, security and the small helpers the script nodes call."""
      import asyncio
      import hashlib
      import hmac
      import json
      import math as _math
      import os
      import re
      import sys
      import time
      import uuid
      from dataclasses import dataclass, field as _dc_field
      from datetime import datetime, timezone

      from fastapi import FastAPI, Request
      from fastapi.concurrency import run_in_threadpool
      from fastapi.responses import JSONResponse, Response
      from starlette.exceptions import HTTPException as StarletteHTTPException

      # === Settings === #


      @dataclass
      class Config:
          auth: bool
          api_key: str
          origins: list
          max_body: int
          rate_limit: int
          host: str
          port: int
          data_dir: str
          timeout: float

          def origin_allowed(self, origin):
              return any(allowed == "*" or allowed == origin for allowed in self.origins)

          def key_ok(self, key):
              """Compares the key in constant time (both sides are hashed first, so the length does not leak)."""
              if not self.api_key or not isinstance(key, str) or key == "":
                  return False
              a = hashlib.sha256(key.encode("utf-8")).digest()
              b = hashlib.sha256(self.api_key.encode("utf-8")).digest()
              return hmac.compare_digest(a, b)


      def _env_int(name, fallback):
          try:
              return int(os.environ.get(name, "").strip())
          except ValueError:
              return fallback


      def _load_env_file(path):
          """Reads KEY=VALUE lines. Variables that are already set win, so the real environment overrides the file."""
          try:
              with open(path, encoding="utf-8") as handle:
                  lines = handle.read().splitlines()
          except OSError:
              return
          for raw in lines:
              line = raw.strip()
              if line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              key = key.strip()
              if key and key not in os.environ:
                  os.environ[key] = value.strip().strip("\"'")


      def load_config(auth, port, max_body_kb, rate_limit):
          """Reads the settings. It stops the program when the API key is required but missing."""
          _load_env_file(".env")
          cfg = Config(
              auth=auth,
              api_key=os.environ.get("API_KEY", ""),
              origins=[item.strip() for item in os.environ.get("ALLOWED_ORIGINS", "").split(",") if item.strip()],
              max_body=_env_int("MAX_BODY_KB", max_body_kb) * 1024,
              rate_limit=_env_int("RATE_LIMIT_PER_MIN", rate_limit),
              host=os.environ.get("HOST", "").strip() or "127.0.0.1",
              port=_env_int("PORT", port),
              data_dir=os.environ.get("DATA_DIR", "").strip() or "data",
              timeout=float(_env_int("REQUEST_TIMEOUT_SECONDS", 15)),
          )
          if cfg.auth and cfg.api_key == "":
              sys.exit("API_KEY is empty. Set it in .env (or turn the API key off in the script).")
          return cfg


      # === Errors and answers === #


      class ApiError(Exception):
          """Raised by the helpers and turned into a JSON answer by the route wrapper."""

          def __init__(self, status, code, fields=None):
              super().__init__(code)
              self.status = status
              self.code = code
              self.fields = fields


      def fail(status, code):
          raise ApiError(status, code)


      def json_response(status, body):
          try:
              data = json.dumps(body, ensure_ascii=False, allow_nan=False).encode("utf-8")
          except (TypeError, ValueError):
              status, data = 500, b'{"error":"internal_error"}'
          return Response(content=data, status_code=status, media_type="application/json")


      def send(status, body):
          code = to_float(status)
          if code is None or code < 200 or code > 599:
              code = 500
          code = int(code)
          if code in (204, 304):
              return Response(status_code=code)
          return json_response(code, body)


      def error_response(error):
          if isinstance(error, ApiError):
              body = {"error": error.code}
              if error.fields:
                  body["fields"] = error.fields
              return json_response(error.status, body)
          log("error", "unexpected failure")
          return json_response(500, {"error": "internal_error"})


      # === Security: headers, CORS, rate limit === #


      def secure(app, cfg):
          """Adds the security headers, answers CORS only for ALLOWED_ORIGINS and limits the requests per client."""
          hits = {}

          def allow(key):
              if cfg.rate_limit <= 0:
                  return True
              now = time.monotonic()
              entry = hits.get(key)
              if entry is None or now - entry[0] >= 60:
                  if len(hits) > 10000:  # bound the memory: forget old clients first, then everybody
                      for k in [k for k, v in hits.items() if now - v[0] >= 60]:
                          del hits[k]
                      if len(hits) > 10000:
                          hits.clear()
                  entry = [now, 0]
                  hits[key] = entry
              entry[1] += 1
              return entry[1] <= cfg.rate_limit

          @app.exception_handler(StarletteHTTPException)
          async def http_error(request, exc):
              codes = {404: "not_found", 405: "method_not_allowed"}
              return json_response(exc.status_code, {"error": codes.get(exc.status_code, "error")})

          @app.middleware("http")
          async def guard(request, call_next):
              origin = request.headers.get("origin")
              allowed = bool(origin) and cfg.origin_allowed(origin)
              client = request.client.host if request.client else "unknown"
              if request.method == "OPTIONS":
                  response = json_response(403, {"error": "origin_not_allowed"}) if origin and not allowed else Response(status_code=204)
              elif not allow(client):
                  response = json_response(429, {"error": "rate_limited"})
                  response.headers["Retry-After"] = "60"
              else:
                  try:
                      response = await call_next(request)
                  except Exception:
                      log("error", "unexpected failure")
                      response = json_response(500, {"error": "internal_error"})
              h = response.headers
              h["X-Content-Type-Options"] = "nosniff"
              h["X-Frame-Options"] = "DENY"
              h["Referrer-Policy"] = "no-referrer"
              h["Content-Security-Policy"] = "default-src 'none'; frame-ancestors 'none'"
              h["Cache-Control"] = "no-store"
              if allowed:
                  h.append("Vary", "Origin")
                  h["Access-Control-Allow-Origin"] = origin
                  h["Access-Control-Allow-Headers"] = "Content-Type, X-API-Key"
                  h["Access-Control-Allow-Methods"] = "GET, POST, PUT, PATCH, DELETE"
                  h["Access-Control-Max-Age"] = "600"
              return response


      # === Routes === #


      class Req:
          """What the script sees of a request (or of a WebSocket message: only body is set there)."""

          def __init__(self, body=None, query=None, params=None, headers=None):
              self.body = body
              self.query = query or {}
              self.params = params or {}
              self.headers = headers or {}


      def _reject_constant(_name):
          raise ValueError("not JSON")


      async def _read_body(request, limit):
          declared = request.headers.get("content-length")
          if declared and declared.isdigit() and int(declared) > limit:
              fail(413, "payload_too_large")
          chunks, size = [], 0
          async for chunk in request.stream():
              size += len(chunk)
              if size > limit:
                  fail(413, "payload_too_large")
              chunks.append(chunk)
          data = b"".join(chunks)
          if not data.strip():
              return None
          if "json" not in request.headers.get("content-type", "").lower():
              fail(415, "unsupported_media_type")
          try:
              return json.loads(data, parse_constant=_reject_constant)
          except (ValueError, RecursionError):
              fail(400, "invalid_json")


      def router(app: FastAPI, cfg: Config):
          """Returns the decorator that registers a route: the key check comes first, then the body is read and parsed."""

          def route(method, path, auth):
              def register(handler):
                  async def endpoint(request: Request):
                      try:
                          if auth and not cfg.key_ok(request.headers.get("x-api-key")):
                              return json_response(401, {"error": "unauthorized"})
                          body = None
                          if request.method not in ("GET", "HEAD"):
                              body = await asyncio.wait_for(_read_body(request, cfg.max_body), cfg.timeout)
                          query = {key: request.query_params.get(key) for key in request.query_params.keys()}
                          req = Req(body, query, dict(request.path_params), dict(request.headers))
                          response = await asyncio.wait_for(run_in_threadpool(handler, req), cfg.timeout)
                          return response if isinstance(response, Response) else Response(status_code=204)
                      except asyncio.TimeoutError:
                          return json_response(503, {"error": "timeout"})
                      except Exception as error:
                          return error_response(error)

                  app.add_api_route(path, endpoint, methods=[method], include_in_schema=False)
                  return handler

              return register

          return route


      def log(level, message):
          """Writes one line. Line breaks and other control characters are replaced, so text from a request cannot fake a log line."""
          text_ = "".join(" " if ord(c) < 32 or ord(c) == 127 or ord(c) in (0x2028, 0x2029) else c for c in to_text(message)[:500])
          name = level if level in ("warn", "error") else "info"
          print(f"[{name}] {text_}", flush=True)


      # === Values: plain JSON values (None, bool, int, float, str, list, dict) === #

      _NUMBER_TEXT = re.compile(r"^-?[0-9]+(\.[0-9]+)?$")


      def body(req, key):
          return req.body.get(key) if isinstance(req.body, dict) else None


      def query(req, key):
          return req.query.get(key)


      def param(req, key):
          value = req.params.get(key)
          return value if value else None


      def header(req, key):
          value = req.headers.get(key.lower())
          return value if value else None


      def or_body(req, value):
          """The value itself, or the request body when nothing was wired."""
          return req.body if value is None else value


      def to_float(v):
          """Reads numbers and number-like text ("12", "-3.5"). Other text is not a number."""
          if isinstance(v, bool):
              return None
          if isinstance(v, (int, float)):
              return float(v) if _math.isfinite(v) else None
          if isinstance(v, str) and _NUMBER_TEXT.match(v):
              return float(v)
          return None


      def _tidy(x):
          return int(x) if x == _math.trunc(x) and abs(x) < 1e15 else x


      def to_text(v):
          if v is None:
              return ""
          if isinstance(v, str):
              return v
          if isinstance(v, bool):
              return "true" if v else "false"
          if isinstance(v, (int, float)):
              return str(_tidy(v)) if _math.isfinite(v) else ""
          try:
              return json.dumps(v, ensure_ascii=False)
          except (TypeError, ValueError):
              return ""


      def truthy(v):
          if v is None:
              return False
          if isinstance(v, bool):
              return v
          if isinstance(v, str):
              return v.strip().lower() not in ("", "false", "no", "0")
          if isinstance(v, (list, dict)):
              return len(v) > 0
          f = to_float(v)
          return True if f is None else f != 0


      def cmp(a, op, b):
          if op == "contains":
              if isinstance(a, list):
                  return any(to_text(item) == to_text(b) for item in a)
              return to_text(b) in to_text(a)
          if op == "startsWith":
              return to_text(a).startswith(to_text(b))
          x, y = to_float(a), to_float(b)
          if x is not None and y is not None:
              order = -1 if x < y else (1 if x > y else 0)
          else:
              s, t = to_text(a), to_text(b)
              order = -1 if s < t else (1 if s > t else 0)
          return {"eq": order == 0, "ne": order != 0, "lt": order < 0, "le": order <= 0, "gt": order > 0, "ge": order >= 0}.get(op, False)


      def logic(a, op, b):
          if op == "and":
              return truthy(a) and truthy(b)
          if op == "or":
              return truthy(a) or truthy(b)
          return not truthy(a)


      def concat(a, b, separator):
          return to_text(a) + separator + to_text(b)


      def text(v, op):
          t = to_text(v)
          if op == "upper":
              return t.upper()
          if op == "lower":
              return t.lower()
          if op == "length":
              return len(t)
          return t.strip()


      def math(a, op, b):
          x, y = to_float(a), to_float(b)
          if x is None or y is None:
              return None
          result = None
          if op == "add":
              result = x + y
          elif op == "sub":
              result = x - y
          elif op == "mul":
              result = x * y
          elif op == "div" and y != 0:
              result = x / y
          elif op == "mod" and y != 0:
              result = _math.fmod(x, y)
          elif op == "min":
              result = min(x, y)
          elif op == "max":
              result = max(x, y)
          return None if result is None or not _math.isfinite(result) else _tidy(result)


      def now():
          moment = datetime.now(timezone.utc)
          return moment.strftime("%Y-%m-%dT%H:%M:%S.") + f"{moment.microsecond // 1000:03d}Z"


      def new_id():
          return str(uuid.uuid4())


      def field(obj_, key):
          return obj_.get(key) if isinstance(obj_, dict) else None


      def obj(ka, a, kb, b, kc, c):
          return {key: value for key, value in ((ka, a), (kb, b), (kc, c)) if key != ""}


      def first(items):
          return items[0] if isinstance(items, list) and items else None


      def count(items):
          return len(items) if isinstance(items, list) else 0
  - path: wsrt.py
    when: websocket
    template: |
      """WebSocket support: origin, key, message size and message rate are checked before a handler runs."""
      import json
      import time

      from fastapi import WebSocket

      import rt

      _handlers = {}
      _clients = set()


      async def send(ws, event, data):
          try:
              await ws.send_text(json.dumps({"event": event, "data": data}, ensure_ascii=False, allow_nan=False))
          except Exception:
              pass


      async def broadcast(ws, event, data, to):
          """Sends to every other client, or to all of them (including the sender) when `to` is "all"."""
          for other in list(_clients):
              if other is not ws or to == "all":
                  await send(other, event, data)


      def attach(app, cfg):
          """Adds /ws. It checks the origin and the API key before accepting, limits the message size and the messages per minute
          of every connection, and only accepts JSON text messages {"event": "...", "data": ...}. Returns the decorator for events."""

          def ws_event(name):
              def register(handler):
                  _handlers[name] = handler
                  return handler

              return register

          @app.websocket("/ws")
          async def endpoint(ws: WebSocket):
              origin = ws.headers.get("origin")
              if origin and not cfg.origin_allowed(origin):
                  await ws.close(code=1008)
                  return
              if cfg.auth and not cfg.key_ok(ws.headers.get("x-api-key") or ws.query_params.get("key")):
                  await ws.close(code=1008)
                  return
              if len(_clients) >= 1000:
                  await ws.close(code=1013)
                  return
              await ws.accept()
              _clients.add(ws)
              started, messages = time.monotonic(), 0
              try:
                  while True:
                      incoming = await ws.receive()
                      if incoming["type"] == "websocket.disconnect":
                          break
                      if time.monotonic() - started >= 60:
                          started, messages = time.monotonic(), 0
                      messages += 1
                      if cfg.rate_limit > 0 and messages > cfg.rate_limit:
                          await ws.close(code=1008)
                          break
                      raw = incoming.get("text")
                      if raw is None or len(raw.encode("utf-8")) > cfg.max_body:
                          await send(ws, "error", {"error": "invalid_message"})
                          continue
                      try:
                          message = json.loads(raw)
                      except (ValueError, RecursionError):
                          message = None
                      if not isinstance(message, dict) or not isinstance(message.get("event"), str) or message["event"] == "":
                          await send(ws, "error", {"error": "invalid_message"})
                          continue
                      handler = _handlers.get(message["event"])
                      if handler is None:
                          await send(ws, "error", {"error": "unknown_event"})
                          continue
                      try:
                          await handler(ws, rt.Req(message.get("data")))
                      except rt.ApiError as error:
                          await send(ws, "error", {"error": error.code, **({"fields": error.fields} if error.fields else {})})
                      except Exception:
                          rt.log("error", "unexpected failure")
                          await send(ws, "error", {"error": "internal_error"})
              except Exception:
                  pass
              finally:
                  _clients.discard(ws)

          return ws_event
  - path: store.py
    template: |
      """A small data store for the generated API: tables in memory, saved to data/store.json.
      It only knows the tables and columns of the schema, so a request can never add or change anything else."""
      import io
      import json
      import os
      import threading

      import rt

      _lock = threading.RLock()
      _tables = {}
      _data = {}
      _file = ""


      def open(directory, schema):
          """Reads the schema (JSON text made by the exporter) and the saved rows."""
          global _file
          for table in json.loads(schema).get("tables", []):
              _tables[table["name"]] = table
              _data[table["name"]] = []
          _file = os.path.join(directory, "store.json")
          try:
              with io.open(_file, encoding="utf-8") as handle:
                  saved = json.load(handle)
          except (OSError, ValueError):
              return
          if isinstance(saved, dict):
              for name, rows in saved.items():
                  if name in _tables and isinstance(rows, list):
                      _data[name] = rows


      def _save():
          try:
              os.makedirs(os.path.dirname(_file) or ".", mode=0o700, exist_ok=True)
              temp = _file + ".tmp"
              with io.open(temp, "w", encoding="utf-8") as handle:
                  json.dump(_data, handle)
              os.chmod(temp, 0o600)
              os.replace(temp, _file)
          except (OSError, TypeError, ValueError):
              rt.fail(500, "internal_error")


      def _get(name):
          table = _tables.get(name)
          if table is None:
              rt.fail(500, "internal_error")  # names come from the script, never from a request
          return table


      def _resolve(table, name):
          """The column to match on: the named one, else the primary key, else the first column."""
          if not name:
              return table.get("primary") or table["columns"][0]["name"]
          if any(c["name"] == name for c in table["columns"]):
              return name
          rt.fail(500, "internal_error")


      def _coerce(kind, v):
          """Returns (ok, value)."""
          if kind == "int":
              f = None if isinstance(v, bool) else rt.to_float(v)
              if f is None or f != int(f) or abs(f) > 9e15:
                  return False, None
              return True, int(f)
          if kind == "float":
              f = rt.to_float(v)
              return (f is not None), f
          if kind == "bool":
              if isinstance(v, bool):
                  return True, v
              if isinstance(v, str) and v.lower() in ("true", "false"):
                  return True, v.lower() == "true"
              if isinstance(v, (int, float)) and v in (0, 1):
                  return True, v == 1
              return False, None
          if kind == "json":
              return True, v
          if isinstance(v, (str, int, float, bool)):
              t = rt.to_text(v)
              return (len(t) <= 10000), t
          return False, None


      def _validate(table, given, mode):
          if not isinstance(given, dict):
              rt.fail(400, "invalid_input")
          clean, bad = {}, {}
          for c in table["columns"]:  # only columns of the schema are ever read: no mass assignment
              name = c["name"]
              if name not in given:
                  if mode == "full" and not c.get("nullable") and not c.get("auto") and not c.get("primary") and not c.get("default"):
                      bad[name] = "required"
                  continue
              v = given[name]
              if v is None:
                  if c.get("nullable"):
                      clean[name] = None
                  else:
                      bad[name] = "required"
                  continue
              ok, value = _coerce(c["kind"], v)
              if ok:
                  clean[name] = value
              else:
                  bad[name] = "invalid"
          if bad:
              raise rt.ApiError(400, "invalid_input", bad)
          return clean


      def _unique(table, rows):
          """True when no primary key or unique column holds the same value twice."""
          for c in table["columns"]:
              if not c.get("primary") and not c.get("unique"):
                  continue
              seen = set()
              for r in rows:
                  if r.get(c["name"]) is None:
                      continue
                  key = rt.to_text(r[c["name"]])
                  if key in seen:
                      return False
                  seen.add(key)
          return True


      def _same(a, b):
          return a is not None and rt.to_text(a) == rt.to_text(b)


      def _next_key(rows, c):
          if c["kind"] != "int":
              return rt.new_id()
          highest = 0
          for r in rows:
              f = rt.to_float(r.get(c["name"]))
              if f is not None and f > highest:
                  highest = f
          return int(highest) + 1


      def validate(name, given, mode):
          return _validate(_get(name), given, mode)


      def find(name, column, value):
          """The rows whose column equals the value (at most 1000). No value means all rows."""
          table = _get(name)
          col = _resolve(table, column)
          with _lock:
              out = []
              for r in _data[name]:
                  if value is None or _same(r.get(col), value):
                      out.append(dict(r))
                      if len(out) >= 1000:
                          break
              return out


      def insert(name, values):
          table = _get(name)
          r = _validate(table, values, "full")
          with _lock:
              rows = _data[name]
              for c in table["columns"]:
                  if c["name"] in r:
                      continue
                  r[c["name"]] = None
                  if c.get("primary") or c.get("auto"):
                      r[c["name"]] = _next_key(rows, c)
                  elif c.get("default"):
                      if c["kind"] == "date" and c["default"].lower() in ("now()", "now", "current_timestamp"):
                          r[c["name"]] = rt.now()
                      else:
                          ok, value = _coerce(c["kind"], c["default"])
                          if ok:
                              r[c["name"]] = value
              nxt = rows + [r]
              if not _unique(table, nxt):
                  rt.fail(409, "conflict")
              _data[name] = nxt
              _save()
              return dict(r)


      def update(name, column, value, values):
          """Changes the rows that match. The primary key is never changed. No value matches nothing."""
          table = _get(name)
          col = _resolve(table, column)
          clean = _validate(table, values, "partial")
          if table.get("primary"):
              clean.pop(table["primary"], None)
          if value is None:
              return []
          with _lock:
              out, nxt = [], []
              for r in _data[name]:
                  if _same(r.get(col), value):
                      merged = {**r, **clean}
                      out.append(dict(merged))
                      nxt.append(merged)
                  else:
                      nxt.append(r)
              if out:
                  if not _unique(table, nxt):
                      rt.fail(409, "conflict")
                  _data[name] = nxt
                  _save()
              return out


      def remove(name, column, value):
          """Deletes the rows that match and returns how many. No value deletes nothing."""
          table = _get(name)
          col = _resolve(table, column)
          if value is None:
              return 0
          with _lock:
              kept = [r for r in _data[name] if not _same(r.get(col), value)]
              removed = len(_data[name]) - len(kept)
              if removed:
                  _data[name] = kept
                  _save()
              return removed
