# Go: net/http (Go 1.22 pattern routing) + gorilla/websocket. See docs/FORMATS.md section 2.
id: go
name: Go (net/http)
description: Standard library server with Go 1.22 routing and gorilla/websocket. One small binary, no framework.
capabilities: [rest, websocket]
runtime: "Go 1.22+"
runCommand: "go mod tidy && go run ."
stringStyle: default
indent: "    "
literals: { null: "nil", true: "true", false: "false", object: "map[string]any{}", list: "[]any{}" }
declare: "{{name}} := {{expr}}"
usedMarker: "_ = {{name}}"
dependencies:
  - { name: github.com/gorilla/websocket, version: v1.5.3, when: websocket }
dependencyFormat: "    {{name}} {{version}}"
devDependencyFormat: "    {{name}} {{version}}"
dependencySeparator: "\n"
packages:
  - id: compress
    name: Compression
    description: gzip answers with gorilla/handlers
    dependencies: [ { name: github.com/gorilla/handlers, version: v1.5.2 } ]
    imports: [ '"github.com/gorilla/handlers"' ]
    setup: [ "handler = handlers.CompressHandler(handler)" ]
  - id: access-log
    name: Access log
    description: Writes one line per request to the console (Apache combined format)
    dependencies: [ { name: github.com/gorilla/handlers, version: v1.5.2 } ]
    imports: [ '"github.com/gorilla/handlers"', '"os"' ]
    setup: [ "handler = handlers.CombinedLoggingHandler(os.Stdout, handler)" ]
  - id: hsts
    name: HSTS header
    description: Tells browsers to use HTTPS only. Turn on when the API sits behind HTTPS.
    imports: []
    setup:
      - |
        handler = func(next http.Handler) http.Handler {
            return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
                w.Header().Set("Strict-Transport-Security", "max-age=63072000; includeSubDomains")
                next.ServeHTTP(w, r)
            })
        }(handler)
websocket:
  imports: []
  setup: |
    handlers := map[string]func(*rt.Conn, *rt.Req){}
    {{wsHandlers}}
    mux.HandleFunc("/ws", rt.WsHandler(cfg, handlers))
files:
  - path: go.mod
    template: |
      module {{appSlug}}

      go 1.22

      require (
      {{dependencies}}
      )
  - path: main.go
    template: |
      // {{appName}}: generated by Cosmos-Scintillation. Settings come from .env (see README.md).
      package main

      import (
          "log"
          "net/http"
          "time"

          "{{appSlug}}/internal/rt"
          "{{appSlug}}/internal/store"
          {{imports}}
      )

      func main() {
          cfg := rt.LoadConfig({{requireApiKey}}, {{port}}, {{maxBodyKb}}, {{rateLimit}})
          store.Open(cfg.DataDir, {{schemaJson}})

          mux := http.NewServeMux()
          route := rt.Router(cfg)
          _ = route

          {{routes}}

          {{wsSetup}}

          mux.HandleFunc("/", rt.NotFound)
          var handler http.Handler = rt.Secure(cfg, mux)
          {{setup}}

          srv := &http.Server{
              Addr:              cfg.Host + ":" + cfg.Port,
              Handler:           handler,
              ReadHeaderTimeout: 5 * time.Second,
              ReadTimeout:       cfg.Timeout,
              WriteTimeout:      2 * cfg.Timeout,
              IdleTimeout:       60 * time.Second,
              MaxHeaderBytes:    16 << 10,
          }
          log.Printf("listening on http://%s", srv.Addr)
          log.Fatal(srv.ListenAndServe())
      }
  - path: internal/rt/rt.go
    template: |
      // Package rt is the runtime of the generated API: settings, security and the small helpers the script nodes call.
      package rt

      import (
          "bufio"
          "crypto/sha256"
          "crypto/subtle"
          "encoding/json"
          "errors"
          "io"
          "log"
          "net"
          "net/http"
          "os"
          "strconv"
          "strings"
          "sync"
          "time"
      )

      // === Settings === //

      type Config struct {
          Auth      bool
          APIKey    string
          Origins   []string
          MaxBody   int64
          RateLimit int
          Host      string
          Port      string
          DataDir   string
          Timeout   time.Duration
      }

      func envInt(name string, fallback int) int {
          if n, err := strconv.Atoi(strings.TrimSpace(os.Getenv(name))); err == nil {
              return n
          }
          return fallback
      }

      // loadEnvFile reads KEY=VALUE lines. Variables that are already set win, so the real environment overrides the file.
      func loadEnvFile(path string) {
          file, err := os.Open(path)
          if err != nil {
              return
          }
          defer file.Close()
          scanner := bufio.NewScanner(file)
          for scanner.Scan() {
              line := strings.TrimSpace(scanner.Text())
              key, value, ok := strings.Cut(line, "=")
              if !ok || strings.HasPrefix(line, "#") {
                  continue
              }
              key, value = strings.TrimSpace(key), strings.Trim(strings.TrimSpace(value), "\"'")
              if _, set := os.LookupEnv(key); !set && key != "" {
                  os.Setenv(key, value)
              }
          }
      }

      // LoadConfig reads the settings. It stops the program when the API key is required but missing.
      func LoadConfig(auth bool, port, maxBodyKb, rateLimit int) Config {
          loadEnvFile(".env")
          cfg := Config{
              Auth:      auth,
              APIKey:    os.Getenv("API_KEY"),
              MaxBody:   int64(envInt("MAX_BODY_KB", maxBodyKb)) * 1024,
              RateLimit: envInt("RATE_LIMIT_PER_MIN", rateLimit),
              Host:      "127.0.0.1",
              Port:      strconv.Itoa(envInt("PORT", port)),
              DataDir:   "data",
              Timeout:   time.Duration(envInt("REQUEST_TIMEOUT_SECONDS", 15)) * time.Second,
          }
          if host := strings.TrimSpace(os.Getenv("HOST")); host != "" {
              cfg.Host = host
          }
          if dir := strings.TrimSpace(os.Getenv("DATA_DIR")); dir != "" {
              cfg.DataDir = dir
          }
          for _, origin := range strings.Split(os.Getenv("ALLOWED_ORIGINS"), ",") {
              if origin = strings.TrimSpace(origin); origin != "" {
                  cfg.Origins = append(cfg.Origins, origin)
              }
          }
          if cfg.Auth && cfg.APIKey == "" {
              log.Fatal("API_KEY is empty. Set it in .env (or turn the API key off in the script).")
          }
          return cfg
      }

      func (cfg Config) OriginAllowed(origin string) bool {
          for _, allowed := range cfg.Origins {
              if allowed == "*" || allowed == origin {
                  return true
              }
          }
          return false
      }

      // KeyOK compares the key in constant time (both sides are hashed first, so the length does not leak).
      func (cfg Config) KeyOK(key string) bool {
          if cfg.APIKey == "" || key == "" {
              return false
          }
          a, b := sha256.Sum256([]byte(key)), sha256.Sum256([]byte(cfg.APIKey))
          return subtle.ConstantTimeCompare(a[:], b[:]) == 1
      }

      // === Errors and answers === //

      // ApiError is thrown (as a panic) by the helpers and turned into a JSON answer by the route wrapper.
      // A flow chart has no place to wire an error, so this keeps the generated code short.
      type ApiError struct {
          Status int
          Code   string
          Fields map[string]string
      }

      func (e *ApiError) Error() string { return e.Code }

      func Fail(status int, code string) { panic(&ApiError{Status: status, Code: code}) }

      func WriteJSON(w http.ResponseWriter, status int, body any) {
          data, err := json.Marshal(body)
          if err != nil {
              status, data = 500, []byte(`{"error":"internal_error"}`)
          }
          w.Header().Set("Content-Type", "application/json; charset=utf-8")
          w.WriteHeader(status)
          w.Write(data)
      }

      func Send(w http.ResponseWriter, status any, body any) {
          code, ok := ToFloat(status)
          if !ok || code < 200 || code > 599 {
              code = 500
          }
          if code == 204 || code == 304 {
              w.WriteHeader(int(code))
              return
          }
          WriteJSON(w, int(code), body)
      }

      func NotFound(w http.ResponseWriter, r *http.Request) {
          WriteJSON(w, 404, map[string]any{"error": "not_found"})
      }

      func handlePanic(w http.ResponseWriter, value any) {
          if value == nil {
              return
          }
          if value == http.ErrAbortHandler {
              panic(value)
          }
          var apiErr *ApiError
          if err, ok := value.(error); ok && errors.As(err, &apiErr) {
              body := map[string]any{"error": apiErr.Code}
              if apiErr.Fields != nil {
                  body["fields"] = apiErr.Fields
              }
              WriteJSON(w, apiErr.Status, body)
              return
          }
          Log("error", "unexpected failure")
          WriteJSON(w, 500, map[string]any{"error": "internal_error"})
      }

      // === Security: headers, CORS, rate limit === //

      type window struct {
          start time.Time
          count int
      }

      type limiter struct {
          mu    sync.Mutex
          limit int
          hits  map[string]*window
      }

      // allow counts requests per client in a fixed one minute window. A limit of 0 or less turns it off.
      func (l *limiter) allow(key string) bool {
          if l.limit <= 0 {
              return true
          }
          l.mu.Lock()
          defer l.mu.Unlock()
          now := time.Now()
          w := l.hits[key]
          if w == nil || now.Sub(w.start) >= time.Minute {
              if len(l.hits) > 10000 { // bound the memory: forget old clients first, then everybody
                  for k, v := range l.hits {
                      if now.Sub(v.start) >= time.Minute {
                          delete(l.hits, k)
                      }
                  }
                  if len(l.hits) > 10000 {
                      l.hits = map[string]*window{}
                  }
              }
              w = &window{start: now}
              l.hits[key] = w
          }
          w.count++
          return w.count <= l.limit
      }

      func clientIP(r *http.Request) string {
          host, _, err := net.SplitHostPort(r.RemoteAddr)
          if err != nil {
              return r.RemoteAddr
          }
          return host
      }

      // Secure adds the security headers, answers CORS only for ALLOWED_ORIGINS and limits the requests per client.
      func Secure(cfg Config, next http.Handler) http.Handler {
          lim := &limiter{limit: cfg.RateLimit, hits: map[string]*window{}}
          return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
              h := w.Header()
              h.Set("X-Content-Type-Options", "nosniff")
              h.Set("X-Frame-Options", "DENY")
              h.Set("Referrer-Policy", "no-referrer")
              h.Set("Content-Security-Policy", "default-src 'none'; frame-ancestors 'none'")
              h.Set("Cache-Control", "no-store")
              origin := r.Header.Get("Origin")
              allowed := origin != "" && cfg.OriginAllowed(origin)
              if allowed {
                  h.Add("Vary", "Origin")
                  h.Set("Access-Control-Allow-Origin", origin)
                  h.Set("Access-Control-Allow-Headers", "Content-Type, X-API-Key")
                  h.Set("Access-Control-Allow-Methods", "GET, POST, PUT, PATCH, DELETE")
                  h.Set("Access-Control-Max-Age", "600")
              }
              if r.Method == http.MethodOptions {
                  if origin != "" && !allowed {
                      WriteJSON(w, 403, map[string]any{"error": "origin_not_allowed"})
                  } else {
                      w.WriteHeader(204)
                  }
                  return
              }
              if !lim.allow(clientIP(r)) {
                  h.Set("Retry-After", "60")
                  WriteJSON(w, 429, map[string]any{"error": "rate_limited"})
                  return
              }
              next.ServeHTTP(w, r)
          })
      }

      // === Routes === //

      // Req is what the script sees of a request (or of a WebSocket message: only Body is set there).
      type Req struct {
          Body any
          r    *http.Request
      }

      func readBody(w http.ResponseWriter, r *http.Request, limit int64) any {
          if r.Method == http.MethodGet || r.Method == http.MethodHead || r.ContentLength == 0 {
              return nil
          }
          data, err := io.ReadAll(http.MaxBytesReader(w, r.Body, limit))
          if err != nil {
              var tooBig *http.MaxBytesError
              if errors.As(err, &tooBig) {
                  Fail(413, "payload_too_large")
              }
              Fail(400, "invalid_body")
          }
          if len(strings.TrimSpace(string(data))) == 0 {
              return nil
          }
          if !strings.Contains(r.Header.Get("Content-Type"), "json") {
              Fail(415, "unsupported_media_type")
          }
          var body any
          if json.Unmarshal(data, &body) != nil {
              Fail(400, "invalid_json")
          }
          return body
      }

      // Router returns the function that registers a route: the key check comes first, then the body is read and parsed.
      func Router(cfg Config) func(*http.ServeMux, string, bool, func(http.ResponseWriter, *Req)) {
          return func(mux *http.ServeMux, pattern string, auth bool, handler func(http.ResponseWriter, *Req)) {
              mux.HandleFunc(pattern, func(w http.ResponseWriter, r *http.Request) {
                  defer func() { handlePanic(w, recover()) }()
                  if auth && !cfg.KeyOK(r.Header.Get("X-API-Key")) {
                      WriteJSON(w, 401, map[string]any{"error": "unauthorized"})
                      return
                  }
                  handler(w, &Req{Body: readBody(w, r, cfg.MaxBody), r: r})
              })
          }
      }

      // Log writes one line. Line breaks and other control characters are replaced, so text from a request cannot fake a log line.
      func Log(level string, message any) {
          text := []rune(ToText(message))
          if len(text) > 500 {
              text = text[:500]
          }
          for i, c := range text {
              if c < 32 || c == 127 || c == 0x2028 || c == 0x2029 {
                  text[i] = ' '
              }
          }
          switch level {
          case "warn", "error":
          default:
              level = "info"
          }
          log.Printf("[%s] %s", level, string(text))
      }
  - path: internal/rt/values.go
    template: |
      package rt

      import (
          "crypto/rand"
          "encoding/json"
          "fmt"
          "math"
          "regexp"
          "strconv"
          "strings"
          "time"
      )

      // Values are plain JSON values: nil, bool, float64, string, []any and map[string]any.

      var numberText = regexp.MustCompile(`^-?[0-9]+(\.[0-9]+)?$`)

      func Body(req *Req, key string) any {
          if m, ok := req.Body.(map[string]any); ok {
              return m[key]
          }
          return nil
      }

      func Query(req *Req, key string) any {
          if req.r == nil {
              return nil
          }
          if values, ok := req.r.URL.Query()[key]; ok && len(values) > 0 {
              return values[0]
          }
          return nil
      }

      func Param(req *Req, key string) any {
          if req.r == nil || req.r.PathValue(key) == "" {
              return nil
          }
          return req.r.PathValue(key)
      }

      func Header(req *Req, key string) any {
          if req.r == nil || req.r.Header.Get(key) == "" {
              return nil
          }
          return req.r.Header.Get(key)
      }

      // OrBody is the value itself, or the request body when nothing was wired.
      func OrBody(req *Req, value any) any {
          if value == nil {
              return req.Body
          }
          return value
      }

      // ToFloat reads numbers and number-like text ("12", "-3.5"). Other text is not a number.
      func ToFloat(v any) (float64, bool) {
          switch x := v.(type) {
          case float64:
              return x, !math.IsNaN(x) && !math.IsInf(x, 0)
          case float32:
              return float64(x), true
          case int:
              return float64(x), true
          case int64:
              return float64(x), true
          case string:
              if numberText.MatchString(x) {
                  f, err := strconv.ParseFloat(x, 64)
                  return f, err == nil
              }
          }
          return 0, false
      }

      func ToText(v any) string {
          switch x := v.(type) {
          case nil:
              return ""
          case string:
              return x
          case bool:
              return strconv.FormatBool(x)
          case float64:
              if x == math.Trunc(x) && math.Abs(x) < 1e15 {
                  return strconv.FormatInt(int64(x), 10)
              }
              return strconv.FormatFloat(x, 'f', -1, 64)
          case int, int64, float32:
              return fmt.Sprint(x)
          }
          data, err := json.Marshal(v)
          if err != nil {
              return ""
          }
          return string(data)
      }

      func Truthy(v any) bool {
          switch x := v.(type) {
          case nil:
              return false
          case bool:
              return x
          case string:
              switch strings.ToLower(strings.TrimSpace(x)) {
              case "", "false", "no", "0":
                  return false
              }
              return true
          case []any:
              return len(x) > 0
          case map[string]any:
              return len(x) > 0
          }
          if f, ok := ToFloat(v); ok {
              return f != 0
          }
          return true
      }

      func Cmp(a any, op string, b any) bool {
          if op == "contains" {
              if list, ok := a.([]any); ok {
                  for _, item := range list {
                      if ToText(item) == ToText(b) {
                          return true
                      }
                  }
                  return false
              }
              return strings.Contains(ToText(a), ToText(b))
          }
          if op == "startsWith" {
              return strings.HasPrefix(ToText(a), ToText(b))
          }
          order := 0
          fa, okA := ToFloat(a)
          fb, okB := ToFloat(b)
          if okA && okB {
              switch {
              case fa < fb:
                  order = -1
              case fa > fb:
                  order = 1
              }
          } else {
              order = strings.Compare(ToText(a), ToText(b))
          }
          switch op {
          case "eq":
              return order == 0
          case "ne":
              return order != 0
          case "lt":
              return order < 0
          case "le":
              return order <= 0
          case "gt":
              return order > 0
          case "ge":
              return order >= 0
          }
          return false
      }

      func Logic(a any, op string, b any) bool {
          switch op {
          case "and":
              return Truthy(a) && Truthy(b)
          case "or":
              return Truthy(a) || Truthy(b)
          }
          return !Truthy(a)
      }

      func Concat(a, b any, separator string) any { return ToText(a) + separator + ToText(b) }

      func Text(v any, op string) any {
          text := ToText(v)
          switch op {
          case "upper":
              return strings.ToUpper(text)
          case "lower":
              return strings.ToLower(text)
          case "length":
              return float64(len([]rune(text)))
          }
          return strings.TrimSpace(text)
      }

      func Math(a any, op string, b any) any {
          x, okA := ToFloat(a)
          y, okB := ToFloat(b)
          if !okA || !okB {
              return nil
          }
          switch op {
          case "add":
              return x + y
          case "sub":
              return x - y
          case "mul":
              return x * y
          case "div":
              if y != 0 {
                  return x / y
              }
          case "mod":
              if y != 0 {
                  return math.Mod(x, y)
              }
          case "min":
              return math.Min(x, y)
          case "max":
              return math.Max(x, y)
          }
          return nil
      }

      func Now() any { return time.Now().UTC().Format("2006-01-02T15:04:05.000Z") }

      func NewId() string {
          b := make([]byte, 16)
          rand.Read(b)
          b[6], b[8] = (b[6]&0x0f)|0x40, (b[8]&0x3f)|0x80
          return fmt.Sprintf("%x-%x-%x-%x-%x", b[0:4], b[4:6], b[6:8], b[8:10], b[10:])
      }

      func Field(obj any, key string) any {
          if m, ok := obj.(map[string]any); ok {
              return m[key]
          }
          return nil
      }

      func Obj(ka string, a any, kb string, b any, kc string, c any) any {
          out := map[string]any{}
          for key, value := range map[string]any{ka: a, kb: b, kc: c} {
              if key != "" {
                  out[key] = value
              }
          }
          return out
      }

      func First(list any) any {
          if items, ok := list.([]any); ok && len(items) > 0 {
              return items[0]
          }
          return nil
      }

      func Count(list any) any {
          if items, ok := list.([]any); ok {
              return float64(len(items))
          }
          return float64(0)
      }
  - path: internal/rt/ws.go
    when: websocket
    template: |
      package rt

      import (
          "encoding/json"
          "net/http"
          "sync"
          "time"

          "github.com/gorilla/websocket"
      )

      // Conn is one WebSocket client. Writes are serialised because gorilla allows one writer at a time.
      type Conn struct {
          ws *websocket.Conn
          mu sync.Mutex
      }

      var (
          hubMu sync.Mutex
          hub   = map[*Conn]struct{}{}
      )

      func (c *Conn) write(event string, data any) {
          payload, err := json.Marshal(map[string]any{"event": event, "data": data})
          if err != nil {
              return
          }
          c.mu.Lock()
          defer c.mu.Unlock()
          c.ws.SetWriteDeadline(time.Now().Add(10 * time.Second))
          if c.ws.WriteMessage(websocket.TextMessage, payload) != nil {
              c.ws.Close()
          }
      }

      func WsSend(c *Conn, event string, data any) { c.write(event, data) }

      // WsBroadcast sends to every other client, or to all of them (including the sender) when `to` is "all".
      func WsBroadcast(c *Conn, event string, data any, to string) {
          hubMu.Lock()
          targets := make([]*Conn, 0, len(hub))
          for other := range hub {
              if other != c || to == "all" {
                  targets = append(targets, other)
              }
          }
          hubMu.Unlock()
          for _, other := range targets {
              other.write(event, data)
          }
      }

      func run(handler func(*Conn, *Req), c *Conn, req *Req) {
          defer func() {
              if value := recover(); value != nil {
                  if apiErr, ok := value.(*ApiError); ok {
                      c.write("error", map[string]any{"error": apiErr.Code, "fields": apiErr.Fields})
                  } else {
                      Log("error", "unexpected failure")
                      c.write("error", map[string]any{"error": "internal_error"})
                  }
              }
          }()
          handler(c, req)
      }

      // WsHandler checks the origin and the API key before the upgrade, limits the message size and the messages per minute
      // of every connection, and only accepts JSON text messages {"event": "...", "data": ...}.
      func WsHandler(cfg Config, handlers map[string]func(*Conn, *Req)) http.HandlerFunc {
          upgrader := websocket.Upgrader{
              ReadBufferSize:  4096,
              WriteBufferSize: 4096,
              CheckOrigin: func(r *http.Request) bool {
                  origin := r.Header.Get("Origin")
                  return origin == "" || cfg.OriginAllowed(origin)
              },
          }
          return func(w http.ResponseWriter, r *http.Request) {
              if cfg.Auth {
                  key := r.Header.Get("X-API-Key")
                  if key == "" {
                      key = r.URL.Query().Get("key")
                  }
                  if !cfg.KeyOK(key) {
                      WriteJSON(w, 401, map[string]any{"error": "unauthorized"})
                      return
                  }
              }
              socket, err := upgrader.Upgrade(w, r, nil)
              if err != nil {
                  return
              }
              c := &Conn{ws: socket}
              socket.SetReadLimit(cfg.MaxBody)
              hubMu.Lock()
              hub[c] = struct{}{}
              hubMu.Unlock()
              defer func() {
                  hubMu.Lock()
                  delete(hub, c)
                  hubMu.Unlock()
                  socket.Close()
              }()

              windowStart, count := time.Now(), 0
              for {
                  kind, data, err := socket.ReadMessage()
                  if err != nil {
                      return
                  }
                  if time.Since(windowStart) >= time.Minute {
                      windowStart, count = time.Now(), 0
                  }
                  count++
                  if cfg.RateLimit > 0 && count > cfg.RateLimit {
                      socket.WriteControl(websocket.CloseMessage, websocket.FormatCloseMessage(websocket.ClosePolicyViolation, "rate_limited"), time.Now().Add(time.Second))
                      return
                  }
                  var message struct {
                      Event string `json:"event"`
                      Data  any    `json:"data"`
                  }
                  if kind != websocket.TextMessage || json.Unmarshal(data, &message) != nil || message.Event == "" {
                      c.write("error", map[string]any{"error": "invalid_message"})
                      continue
                  }
                  handler := handlers[message.Event]
                  if handler == nil {
                      c.write("error", map[string]any{"error": "unknown_event"})
                      continue
                  }
                  run(handler, c, &Req{Body: message.Data})
              }
          }
      }
  - path: internal/store/store.go
    template: |
      // Package store is a small data store for the generated API: tables in memory, saved to data/store.json.
      // It only knows the tables and columns of the schema, so a request can never add or change anything else.
      package store

      import (
          "encoding/json"
          "math"
          "os"
          "path/filepath"
          "strings"
          "sync"

          "{{appSlug}}/internal/rt"
      )

      type column struct {
          Name     string `json:"name"`
          Kind     string `json:"kind"`
          Primary  bool   `json:"primary"`
          Unique   bool   `json:"unique"`
          Nullable bool   `json:"nullable"`
          Auto     bool   `json:"auto"`
          Default  string `json:"default"`
      }

      type table struct {
          Name    string   `json:"name"`
          Primary string   `json:"primary"`
          Columns []column `json:"columns"`
      }

      type row = map[string]any

      var (
          mu     sync.Mutex
          tables = map[string]*table{}
          data   = map[string][]row{}
          file   string
      )

      // Open reads the schema (JSON text made by the exporter) and the saved rows.
      func Open(dir, schema string) {
          var parsed struct {
              Tables []*table `json:"tables"`
          }
          if err := json.Unmarshal([]byte(schema), &parsed); err != nil {
              panic("the schema is not valid: " + err.Error())
          }
          for _, t := range parsed.Tables {
              tables[t.Name] = t
              data[t.Name] = []row{}
          }
          file = filepath.Join(dir, "store.json")
          if raw, err := os.ReadFile(file); err == nil {
              var saved map[string][]row
              if json.Unmarshal(raw, &saved) == nil {
                  for name, rows := range saved {
                      if _, known := tables[name]; known && rows != nil {
                          data[name] = rows
                      }
                  }
              }
          }
      }

      func save() {
          raw, err := json.Marshal(data)
          if err != nil {
              rt.Fail(500, "internal_error")
          }
          if os.MkdirAll(filepath.Dir(file), 0o700) != nil {
              rt.Fail(500, "internal_error")
          }
          temp := file + ".tmp"
          if os.WriteFile(temp, raw, 0o600) != nil || os.Rename(temp, file) != nil {
              rt.Fail(500, "internal_error")
          }
      }

      func get(name string) *table {
          t := tables[name]
          if t == nil {
              rt.Fail(500, "internal_error") // names come from the script, never from a request
          }
          return t
      }

      // resolve gives the column to match on: the named one, else the primary key, else the first column.
      func resolve(t *table, name string) string {
          if name == "" {
              if t.Primary != "" {
                  return t.Primary
              }
              return t.Columns[0].Name
          }
          for _, c := range t.Columns {
              if c.Name == name {
                  return name
              }
          }
          rt.Fail(500, "internal_error")
          return ""
      }

      func coerce(kind string, v any) (any, bool) {
          switch kind {
          case "int":
              f, ok := rt.ToFloat(v)
              if _, isBool := v.(bool); isBool || !ok || f != math.Trunc(f) || math.Abs(f) > 9e15 {
                  return nil, false
              }
              return f, true
          case "float":
              f, ok := rt.ToFloat(v)
              return f, ok
          case "bool":
              switch x := v.(type) {
              case bool:
                  return x, true
              case string:
                  switch strings.ToLower(x) {
                  case "true":
                      return true, true
                  case "false":
                      return false, true
                  }
              case float64:
                  if x == 0 || x == 1 {
                      return x == 1, true
                  }
              }
              return nil, false
          case "json":
              return v, true
          }
          switch v.(type) {
          case string, float64, bool:
              text := rt.ToText(v)
              return text, len(text) <= 10000
          }
          return nil, false
      }

      func validate(t *table, input any, mode string) row {
          in, ok := input.(map[string]any)
          if !ok {
              rt.Fail(400, "invalid_input")
          }
          clean, bad := row{}, map[string]string{}
          for _, c := range t.Columns {
              v, present := in[c.Name]
              switch {
              case !present:
                  if mode == "full" && !c.Nullable && !c.Auto && !c.Primary && c.Default == "" {
                      bad[c.Name] = "required"
                  }
              case v == nil:
                  if c.Nullable {
                      clean[c.Name] = nil
                  } else {
                      bad[c.Name] = "required"
                  }
              default:
                  if cv, ok := coerce(c.Kind, v); ok {
                      clean[c.Name] = cv
                  } else {
                      bad[c.Name] = "invalid"
                  }
              }
          }
          if len(bad) > 0 {
              panic(&rt.ApiError{Status: 400, Code: "invalid_input", Fields: bad})
          }
          return clean
      }

      func copyRow(r row) row {
          out := make(row, len(r))
          for k, v := range r {
              out[k] = v
          }
          return out
      }

      // unique reports whether no primary key or unique column holds the same value twice.
      func unique(t *table, rows []row) bool {
          for _, c := range t.Columns {
              if !c.Primary && !c.Unique {
                  continue
              }
              seen := map[string]bool{}
              for _, r := range rows {
                  if r[c.Name] == nil {
                      continue
                  }
                  key := rt.ToText(r[c.Name])
                  if seen[key] {
                      return false
                  }
                  seen[key] = true
              }
          }
          return true
      }

      func same(a, b any) bool { return a != nil && rt.ToText(a) == rt.ToText(b) }

      func nextKey(rows []row, c column) any {
          if c.Kind != "int" {
              return rt.NewId()
          }
          highest := 0.0
          for _, r := range rows {
              if f, ok := rt.ToFloat(r[c.Name]); ok && f > highest {
                  highest = f
              }
          }
          return highest + 1
      }

      func Validate(name string, input any, mode string) any { return validate(get(name), input, mode) }

      // Find returns the rows whose column equals the value (at most 1000). No value means all rows.
      func Find(name, column string, value any) any {
          t := get(name)
          col := resolve(t, column)
          mu.Lock()
          defer mu.Unlock()
          out := []any{}
          for _, r := range data[name] {
              if value == nil || same(r[col], value) {
                  out = append(out, copyRow(r))
                  if len(out) >= 1000 {
                      break
                  }
              }
          }
          return out
      }

      func Insert(name string, values any) any {
          t := get(name)
          r := validate(t, values, "full")
          mu.Lock()
          defer mu.Unlock()
          rows := data[name]
          for _, c := range t.Columns {
              if _, given := r[c.Name]; given {
                  continue
              }
              r[c.Name] = nil
              if c.Primary || c.Auto {
                  r[c.Name] = nextKey(rows, c)
              } else if c.Default != "" {
                  if lower := strings.ToLower(c.Default); c.Kind == "date" && (lower == "now()" || lower == "now" || lower == "current_timestamp") {
                      r[c.Name] = rt.Now()
                  } else if v, ok := coerce(c.Kind, c.Default); ok {
                      r[c.Name] = v
                  }
              }
          }
          next := append(append([]row{}, rows...), r)
          if !unique(t, next) {
              rt.Fail(409, "conflict")
          }
          data[name] = next
          save()
          return copyRow(r)
      }

      // Update changes the rows that match. The primary key is never changed. No value matches nothing.
      func Update(name, column string, value, values any) any {
          t := get(name)
          col := resolve(t, column)
          clean := validate(t, values, "partial")
          delete(clean, t.Primary)
          out := []any{}
          if value == nil {
              return out
          }
          mu.Lock()
          defer mu.Unlock()
          rows := data[name]
          next := make([]row, len(rows))
          for i, r := range rows {
              next[i] = r
              if same(r[col], value) {
                  merged := copyRow(r)
                  for k, v := range clean {
                      merged[k] = v
                  }
                  next[i] = merged
                  out = append(out, copyRow(merged))
              }
          }
          if len(out) > 0 {
              if !unique(t, next) {
                  rt.Fail(409, "conflict")
              }
              data[name] = next
              save()
          }
          return out
      }

      // Remove deletes the rows that match and returns how many. No value deletes nothing.
      func Remove(name, column string, value any) any {
          t := get(name)
          col := resolve(t, column)
          if value == nil {
              return float64(0)
          }
          mu.Lock()
          defer mu.Unlock()
          kept := []row{}
          for _, r := range data[name] {
              if !same(r[col], value) {
                  kept = append(kept, r)
              }
          }
          removed := len(data[name]) - len(kept)
          if removed > 0 {
              data[name] = kept
              save()
          }
          return float64(removed)
      }
