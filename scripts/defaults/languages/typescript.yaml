# TypeScript: Express 4 + ws. Runs with tsx (no build step). See docs/FORMATS.md section 2.
id: typescript
name: TypeScript (Express)
description: Express with the ws library for WebSockets. Runs straight from the source with tsx, type check with "npm run check".
capabilities: [rest, websocket]
runtime: "Node.js 20+"
runCommand: "npm install && npm start"
stringStyle: default
indent: "    "
literals: { null: "null", true: "true", false: "false", object: "{}", list: "[]" }
declare: "const {{name}} = {{expr}};"
usedMarker: "void {{name}};"
dependencies:
  - { name: express, version: "^4.21.2" }
  - { name: ws, version: "^8.18.0", when: websocket }
  - { name: typescript, version: "^5.6.3", dev: true }
  - { name: tsx, version: "^4.19.2", dev: true }
  - { name: "@types/node", version: "^20.17.6", dev: true }
  - { name: "@types/express", version: "^4.17.21", dev: true }
  - { name: "@types/ws", version: "^8.5.13", dev: true, when: websocket }
dependencyFormat: '    "{{name}}": "{{version}}"'
devDependencyFormat: '    "{{name}}": "{{version}}"'
dependencySeparator: ",\n"
packages:
  - id: compression
    name: Compression
    description: gzip answers with the compression middleware
    dependencies:
      - { name: compression, version: "^1.7.5" }
      - { name: "@types/compression", version: "^1.7.5", dev: true }
    imports: [ 'import compression from "compression";' ]
    setup: [ "app.use(compression());" ]
  - id: access-log
    name: Access log
    description: Writes one line per request to the console (morgan, combined format)
    dependencies:
      - { name: morgan, version: "^1.10.0" }
      - { name: "@types/morgan", version: "^1.9.9", dev: true }
    imports: [ 'import morgan from "morgan";' ]
    setup: [ 'app.use(morgan("combined"));' ]
  - id: hsts
    name: HSTS header
    description: Tells browsers to use HTTPS only. Turn on when the API sits behind HTTPS.
    imports: []
    setup:
      - |
        app.use((_req, res, next) => {
            res.setHeader("Strict-Transport-Security", "max-age=63072000; includeSubDomains");
            next();
        });
  - id: request-id
    name: Request id
    description: Adds an X-Request-Id header (a fresh random id) to every answer, handy for support requests
    imports: [ 'import {randomUUID} from "node:crypto";' ]
    setup:
      - |
        app.use((_req, res, next) => {
            res.setHeader("X-Request-Id", randomUUID());
            next();
        });
websocket:
  imports: []
  setup: |
    const handlers: Record<string, wsrt.Handler> = {};
    {{wsHandlers}}
    wsrt.attach(server, cfg, handlers);
files:
  - path: package.json
    template: |
      {
        "name": "{{appSlug}}",
        "version": "1.0.0",
        "private": true,
        "type": "module",
        "scripts": {
          "start": "tsx src/index.ts",
          "check": "tsc --noEmit"
        },
        "dependencies": {
      {{dependencies}}
        },
        "devDependencies": {
      {{devDependencies}}
        }
      }
  - path: tsconfig.json
    template: |
      {
        "compilerOptions": {
          "target": "ES2022",
          "module": "ESNext",
          "moduleResolution": "Bundler",
          "strict": true,
          "noImplicitAny": false,
          "allowUnreachableCode": true,
          "esModuleInterop": true,
          "skipLibCheck": true,
          "noEmit": true
        },
        "include": ["src"]
      }
  - path: src/index.ts
    template: |
      // {{appName}}: generated by Cosmos-Scintillation. Settings come from .env (see README.md).
      import http from "node:http";
      import express from "express";
      import * as rt from "./rt.js";
      import * as store from "./store.js";
      {{wsImports}}
      {{imports}}

      const cfg = rt.loadConfig({{requireApiKey}}, {{port}}, {{maxBodyKb}}, {{rateLimit}});
      store.open(cfg.dataDir, {{schemaJson}});

      const app = express();
      app.disable("x-powered-by");
      app.disable("etag");
      const server = http.createServer(app);
      app.use(rt.secure(cfg));
      {{setup}}
      const route = rt.router(app, cfg);

      {{routes}}

      {{wsSetup}}

      app.use(rt.notFound);
      app.use(rt.errorHandler);

      server.requestTimeout = cfg.timeoutMs;
      server.headersTimeout = Math.min(cfg.timeoutMs, 10000);
      server.keepAliveTimeout = 5000;
      server.maxHeadersCount = 100;
      server.listen(cfg.port, cfg.host, () => console.log(`listening on http://${cfg.host}:${cfg.port}`));
  - path: src/rt.ts
    template: |
      // The runtime of the generated API: settings, security and the small helpers the script nodes call.
      import {createHash, randomUUID, timingSafeEqual} from "node:crypto";
      import {existsSync, readFileSync} from "node:fs";
      import express from "express";
      import type {Express, NextFunction, Request, RequestHandler, Response} from "express";

      // === Settings === //

      export interface Config {
          auth: boolean;
          apiKey: string;
          origins: string[];
          maxBody: number;
          rateLimit: number;
          host: string;
          port: number;
          dataDir: string;
          timeoutMs: number;
      }

      const envInt = (name: string, fallback: number): number => {
          const n = Number.parseInt((process.env[name] ?? "").trim(), 10);
          return Number.isFinite(n) ? n : fallback;
      };

      /** Reads KEY=VALUE lines. Variables that are already set win, so the real environment overrides the file. */
      function loadEnvFile(path: string): void {
          if (!existsSync(path)) {
              return;
          }
          for (const raw of readFileSync(path, "utf8").split(/\r?\n/)) {
              const line = raw.trim();
              const at = line.indexOf("=");
              if (line.startsWith("#") || at < 1) {
                  continue;
              }
              const key = line.slice(0, at).trim();
              const value = line.slice(at + 1).trim().replace(/^["']|["']$/g, "");
              if (key && process.env[key] === undefined) {
                  process.env[key] = value;
              }
          }
      }

      /** Reads the settings. It stops the program when the API key is required but missing. */
      export function loadConfig(auth: boolean, port: number, maxBodyKb: number, rateLimit: number): Config {
          loadEnvFile(".env");
          const cfg: Config = {
              auth,
              apiKey: process.env.API_KEY ?? "",
              origins: (process.env.ALLOWED_ORIGINS ?? "").split(",").map((item) => item.trim()).filter(Boolean),
              maxBody: envInt("MAX_BODY_KB", maxBodyKb) * 1024,
              rateLimit: envInt("RATE_LIMIT_PER_MIN", rateLimit),
              host: (process.env.HOST ?? "").trim() || "127.0.0.1",
              port: envInt("PORT", port),
              dataDir: (process.env.DATA_DIR ?? "").trim() || "data",
              timeoutMs: envInt("REQUEST_TIMEOUT_SECONDS", 15) * 1000
          };
          if (cfg.auth && cfg.apiKey === "") {
              console.error("API_KEY is empty. Set it in .env (or turn the API key off in the script).");
              process.exit(1);
          }
          return cfg;
      }

      export const originAllowed = (cfg: Config, origin: string): boolean => cfg.origins.some((allowed) => allowed === "*" || allowed === origin);

      /** Compares the key in constant time (both sides are hashed first, so the length does not leak). */
      export function keyOk(cfg: Config, key: unknown): boolean {
          if (cfg.apiKey === "" || typeof key !== "string" || key === "") {
              return false;
          }
          const a = createHash("sha256").update(key).digest();
          const b = createHash("sha256").update(cfg.apiKey).digest();
          return timingSafeEqual(a, b);
      }

      // === Errors and answers === //

      /** Thrown by the helpers and turned into a JSON answer by the route wrapper. */
      export class ApiError extends Error {
          constructor(public status: number, public code: string, public fields?: Record<string, string>) {
              super(code);
          }
      }

      export function fail(status: number, code: string): never {
          throw new ApiError(status, code);
      }

      export function send(res: Response, status: unknown, body: unknown): void {
          let code = toFloat(status);
          if (code === null || code < 200 || code > 599) {
              code = 500;
          }
          if (code === 204 || code === 304) {
              res.status(code).end();
              return;
          }
          res.status(Math.trunc(code)).json(body ?? null);
      }

      export const notFound: RequestHandler = (_req, res) => {
          res.status(404).json({error: "not_found"});
      };

      export function errorBody(err: any): {status: number; body: Record<string, unknown>} {
          if (err instanceof ApiError) {
              return {status: err.status, body: err.fields ? {error: err.code, fields: err.fields} : {error: err.code}};
          }
          if (err?.type === "entity.too.large") {
              return {status: 413, body: {error: "payload_too_large"}};
          }
          if (err?.type === "entity.parse.failed" || err instanceof SyntaxError) {
              return {status: 400, body: {error: "invalid_json"}};
          }
          log("error", "unexpected failure");
          return {status: 500, body: {error: "internal_error"}};
      }

      export function errorHandler(err: unknown, _req: Request, res: Response, next: NextFunction): void {
          if (res.headersSent) {
              next(err);
              return;
          }
          const {status, body} = errorBody(err);
          res.status(status).json(body);
      }

      // === Security: headers, CORS, rate limit === //

      /** Adds the security headers, answers CORS only for ALLOWED_ORIGINS and limits the requests per client. */
      export function secure(cfg: Config): RequestHandler {
          const hits = new Map<string, {start: number; count: number}>();
          const allow = (key: string): boolean => {
              if (cfg.rateLimit <= 0) {
                  return true;
              }
              const now = Date.now();
              let entry = hits.get(key);
              if (!entry || now - entry.start >= 60000) {
                  if (hits.size > 10000) { // bound the memory: forget old clients first, then everybody
                      for (const [k, v] of hits) {
                          if (now - v.start >= 60000) {
                              hits.delete(k);
                          }
                      }
                      if (hits.size > 10000) {
                          hits.clear();
                      }
                  }
                  entry = {start: now, count: 0};
                  hits.set(key, entry);
              }
              entry.count += 1;
              return entry.count <= cfg.rateLimit;
          };
          return (req, res, next) => {
              res.setHeader("X-Content-Type-Options", "nosniff");
              res.setHeader("X-Frame-Options", "DENY");
              res.setHeader("Referrer-Policy", "no-referrer");
              res.setHeader("Content-Security-Policy", "default-src 'none'; frame-ancestors 'none'");
              res.setHeader("Cache-Control", "no-store");
              const origin = req.headers.origin;
              const allowed = typeof origin === "string" && origin !== "" && originAllowed(cfg, origin);
              if (allowed) {
                  res.append("Vary", "Origin");
                  res.setHeader("Access-Control-Allow-Origin", origin);
                  res.setHeader("Access-Control-Allow-Headers", "Content-Type, X-API-Key");
                  res.setHeader("Access-Control-Allow-Methods", "GET, POST, PUT, PATCH, DELETE");
                  res.setHeader("Access-Control-Max-Age", "600");
              }
              if (req.method === "OPTIONS") {
                  if (origin && !allowed) {
                      res.status(403).json({error: "origin_not_allowed"});
                  } else {
                      res.status(204).end();
                  }
                  return;
              }
              if (!allow(req.socket.remoteAddress ?? "unknown")) {
                  res.setHeader("Retry-After", "60");
                  res.status(429).json({error: "rate_limited"});
                  return;
              }
              next();
          };
      }

      // === Routes === //

      /** What the script sees of a request (or of a WebSocket message: only body is set there). */
      export interface Req {
          body: any;
          query: Record<string, unknown>;
          params: Record<string, string>;
          headers: Record<string, unknown>;
      }

      type RouteHandler = (req: Req, res: Response) => unknown;

      /** Returns the function that registers a route: the key check comes first, then the body is read and parsed. */
      export function router(app: Express, cfg: Config) {
          const parser = express.json({limit: cfg.maxBody, strict: true, type: () => true});
          return (method: string, path: string, auth: boolean, handler: RouteHandler): void => {
              const guard: RequestHandler = (req, res, next) => {
                  if (auth && !keyOk(cfg, req.headers["x-api-key"])) {
                      res.status(401).json({error: "unauthorized"});
                      return;
                  }
                  const hasBody = Number(req.headers["content-length"] ?? 0) > 0 || req.headers["transfer-encoding"] !== undefined;
                  if (hasBody && !/json/i.test(String(req.headers["content-type"] ?? ""))) {
                      res.status(415).json({error: "unsupported_media_type"});
                      return;
                  }
                  next();
              };
              const run: RequestHandler = (req, res, next) => {
                  const hasBody = Number(req.headers["content-length"] ?? 0) > 0 || req.headers["transfer-encoding"] !== undefined;
                  const wrapped: Req = {
                      body: hasBody ? req.body ?? null : null,
                      query: req.query as Record<string, unknown>,
                      params: req.params,
                      headers: req.headers
                  };
                  try {
                      Promise.resolve(handler(wrapped, res)).catch(next);
                  } catch (error) {
                      next(error);
                  }
              };
              (app as any)[method.toLowerCase()](path, guard, parser, run);
          };
      }

      /** Writes one line. Line breaks and other control characters are replaced, so text from a request cannot fake a log line. */
      export function log(level: unknown, message: unknown): void {
          const text = [...toText(message)].slice(0, 500).map((c) => {
              const code = c.codePointAt(0)!;
              return code < 32 || code === 127 || code === 0x2028 || code === 0x2029 ? " " : c;
          }).join("");
          const name = level === "warn" || level === "error" ? level : "info";
          console.log(`[${name}] ${text}`);
      }

      // === Values: plain JSON values (null, boolean, number, string, array, object) === //

      const NUMBER_TEXT = /^-?[0-9]+(\.[0-9]+)?$/;
      const isObject = (v: unknown): v is Record<string, unknown> => typeof v === "object" && v !== null && !Array.isArray(v);

      export const body = (req: Req, key: string): any => (isObject(req.body) && Object.hasOwn(req.body, key) ? req.body[key] : null);
      export const query = (req: Req, key: string): any => (typeof req.query?.[key] === "string" ? req.query[key] : null);
      export const param = (req: Req, key: string): any => (req.params && typeof req.params[key] === "string" && req.params[key] !== "" ? req.params[key] : null);
      export const header = (req: Req, key: string): any => {
          const value = req.headers?.[key.toLowerCase()];
          return typeof value === "string" && value !== "" ? value : null;
      };

      /** The value itself, or the request body when nothing was wired. */
      export const orBody = (req: Req, value: unknown): any => (value === null || value === undefined ? req.body : value);

      /** Reads numbers and number-like text ("12", "-3.5"). Other text is not a number. */
      export function toFloat(v: unknown): number | null {
          if (typeof v === "number") {
              return Number.isFinite(v) ? v : null;
          }
          if (typeof v === "string" && NUMBER_TEXT.test(v)) {
              return Number(v);
          }
          return null;
      }

      export function toText(v: unknown): string {
          if (v === null || v === undefined) {
              return "";
          }
          if (typeof v === "string") {
              return v;
          }
          if (typeof v === "boolean" || typeof v === "number") {
              return String(v);
          }
          try {
              return JSON.stringify(v) ?? "";
          } catch {
              return "";
          }
      }

      export function truthy(v: unknown): boolean {
          if (v === null || v === undefined) {
              return false;
          }
          if (typeof v === "boolean") {
              return v;
          }
          if (typeof v === "string") {
              return !["", "false", "no", "0"].includes(v.trim().toLowerCase());
          }
          if (Array.isArray(v)) {
              return v.length > 0;
          }
          if (isObject(v)) {
              return Object.keys(v).length > 0;
          }
          const f = toFloat(v);
          return f === null ? true : f !== 0;
      }

      export function cmp(a: unknown, op: string, b: unknown): boolean {
          if (op === "contains") {
              return Array.isArray(a) ? a.some((item) => toText(item) === toText(b)) : toText(a).includes(toText(b));
          }
          if (op === "startsWith") {
              return toText(a).startsWith(toText(b));
          }
          const x = toFloat(a);
          const y = toFloat(b);
          let order: number;
          if (x !== null && y !== null) {
              order = x < y ? -1 : x > y ? 1 : 0;
          } else {
              const s = toText(a);
              const t = toText(b);
              order = s < t ? -1 : s > t ? 1 : 0;
          }
          switch (op) {
              case "eq": return order === 0;
              case "ne": return order !== 0;
              case "lt": return order < 0;
              case "le": return order <= 0;
              case "gt": return order > 0;
              case "ge": return order >= 0;
          }
          return false;
      }

      export function logic(a: unknown, op: string, b: unknown): boolean {
          if (op === "and") {
              return truthy(a) && truthy(b);
          }
          if (op === "or") {
              return truthy(a) || truthy(b);
          }
          return !truthy(a);
      }

      export const concat = (a: unknown, b: unknown, separator: string): any => toText(a) + separator + toText(b);

      export function text(v: unknown, op: string): any {
          const t = toText(v);
          switch (op) {
              case "upper": return t.toUpperCase();
              case "lower": return t.toLowerCase();
              case "length": return [...t].length;
          }
          return t.trim();
      }

      export function math(a: unknown, op: string, b: unknown): any {
          const x = toFloat(a);
          const y = toFloat(b);
          if (x === null || y === null) {
              return null;
          }
          switch (op) {
              case "add": return x + y;
              case "sub": return x - y;
              case "mul": return x * y;
              case "div": return y !== 0 ? x / y : null;
              case "mod": return y !== 0 ? x % y : null;
              case "min": return Math.min(x, y);
              case "max": return Math.max(x, y);
          }
          return null;
      }

      export const now = (): any => new Date().toISOString();
      export const newId = (): string => randomUUID();
      export const field = (obj: unknown, key: string): any => (isObject(obj) && Object.hasOwn(obj, key) ? obj[key] : null);

      export function obj(ka: string, a: unknown, kb: string, b: unknown, kc: string, c: unknown): any {
          const out: Record<string, unknown> = {};
          for (const [key, value] of [[ka, a], [kb, b], [kc, c]] as [string, unknown][]) {
              if (key !== "" && key !== "__proto__") {
                  out[key] = value;
              }
          }
          return out;
      }

      export const first = (list: unknown): any => (Array.isArray(list) && list.length > 0 ? list[0] : null);
      export const count = (list: unknown): any => (Array.isArray(list) ? list.length : 0);
  - path: src/ws.ts
    when: websocket
    template: |
      // WebSocket support: origin, key, message size and message rate are checked before a handler runs.
      import type {Server} from "node:http";
      import {WebSocket, WebSocketServer} from "ws";
      import * as rt from "./rt.js";

      export type Handler = (ws: WebSocket, req: rt.Req) => void;

      let wss: WebSocketServer | null = null;

      export function send(ws: WebSocket, event: string, data: unknown): void {
          if (ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({event, data: data ?? null}));
          }
      }

      /** Sends to every other client, or to all of them (including the sender) when `to` is "all". */
      export function broadcast(ws: WebSocket, event: string, data: unknown, to: string): void {
          wss?.clients.forEach((other) => {
              if (other !== ws || to === "all") {
                  send(other, event, data);
              }
          });
      }

      /** Checks the origin and the API key before the upgrade, limits the message size and the messages per minute of every
       * connection, and only accepts JSON text messages {"event": "...", "data": ...}. */
      export function attach(server: Server, cfg: rt.Config, handlers: Record<string, Handler>): void {
          const socketServer = new WebSocketServer({noServer: true, maxPayload: cfg.maxBody});
          wss = socketServer;
          const refuse = (socket: import("node:stream").Duplex, line: string): void => {
              socket.write(`HTTP/1.1 ${line}\r\nConnection: close\r\nContent-Length: 0\r\n\r\n`);
              socket.destroy();
          };

          server.on("upgrade", (req, socket, head) => {
              const url = new URL(req.url ?? "/", "http://localhost");
              if (url.pathname !== "/ws") {
                  refuse(socket, "404 Not Found");
                  return;
              }
              const origin = req.headers.origin;
              if (typeof origin === "string" && origin !== "" && !rt.originAllowed(cfg, origin)) {
                  refuse(socket, "403 Forbidden");
                  return;
              }
              if (cfg.auth && !rt.keyOk(cfg, req.headers["x-api-key"] ?? url.searchParams.get("key"))) {
                  refuse(socket, "401 Unauthorized");
                  return;
              }
              if (socketServer.clients.size >= 1000) {
                  refuse(socket, "503 Service Unavailable");
                  return;
              }
              socketServer.handleUpgrade(req, socket, head, (ws) => {
                  let windowStart = Date.now();
                  let messages = 0;
                  ws.on("error", () => ws.terminate());
                  ws.on("message", (raw, isBinary) => {
                      if (Date.now() - windowStart >= 60000) {
                          windowStart = Date.now();
                          messages = 0;
                      }
                      messages += 1;
                      if (cfg.rateLimit > 0 && messages > cfg.rateLimit) {
                          ws.close(1008, "rate_limited");
                          return;
                      }
                      let message: any;
                      try {
                          message = isBinary ? null : JSON.parse(raw.toString("utf8"));
                      } catch {
                          message = null;
                      }
                      if (typeof message !== "object" || message === null || typeof message.event !== "string" || message.event === "") {
                          send(ws, "error", {error: "invalid_message"});
                          return;
                      }
                      if (!Object.hasOwn(handlers, message.event)) {
                          send(ws, "error", {error: "unknown_event"});
                          return;
                      }
                      try {
                          handlers[message.event](ws, {body: message.data ?? null, query: {}, params: {}, headers: {}});
                      } catch (error) {
                          send(ws, "error", rt.errorBody(error).body);
                      }
                  });
              });
          });
      }
  - path: src/store.ts
    template: |
      // A small data store for the generated API: tables in memory, saved to data/store.json.
      // It only knows the tables and columns of the schema, so a request can never add or change anything else.
      import {existsSync, mkdirSync, readFileSync, renameSync, writeFileSync} from "node:fs";
      import {join} from "node:path";
      import * as rt from "./rt.js";

      interface Column {
          name: string;
          kind: string;
          primary?: boolean;
          unique?: boolean;
          nullable?: boolean;
          auto?: boolean;
          default?: string;
      }

      interface Table {
          name: string;
          primary?: string;
          columns: Column[];
      }

      type Row = Record<string, any>;

      const tables = new Map<string, Table>();
      let data: Record<string, Row[]> = Object.create(null);
      let file = "";

      /** Reads the schema (JSON text made by the exporter) and the saved rows. */
      export function open(dir: string, schema: string): void {
          const parsed = JSON.parse(schema) as {tables: Table[]};
          data = Object.create(null);
          for (const table of parsed.tables ?? []) {
              tables.set(table.name, table);
              data[table.name] = [];
          }
          file = join(dir, "store.json");
          if (existsSync(file)) {
              try {
                  const saved = JSON.parse(readFileSync(file, "utf8")) as Record<string, Row[]>;
                  for (const [name, rows] of Object.entries(saved)) {
                      if (tables.has(name) && Array.isArray(rows)) {
                          data[name] = rows;
                      }
                  }
              } catch {
                  // an unreadable file starts a fresh store
              }
          }
      }

      function save(): void {
          try {
              mkdirSync(join(file, ".."), {recursive: true, mode: 0o700});
              writeFileSync(file + ".tmp", JSON.stringify(data), {mode: 0o600});
              renameSync(file + ".tmp", file);
          } catch {
              rt.fail(500, "internal_error");
          }
      }

      function get(name: string): Table {
          const table = tables.get(name);
          return table ?? rt.fail(500, "internal_error"); // names come from the script, never from a request
      }

      /** The column to match on: the named one, else the primary key, else the first column. */
      function resolve(table: Table, name: string): string {
          if (!name) {
              return table.primary || table.columns[0].name;
          }
          return table.columns.some((c) => c.name === name) ? name : rt.fail(500, "internal_error");
      }

      function coerce(kind: string, v: unknown): {ok: boolean; value?: any} {
          switch (kind) {
              case "int": {
                  const f = typeof v === "boolean" ? null : rt.toFloat(v);
                  return f !== null && Number.isInteger(f) && Math.abs(f) <= 9e15 ? {ok: true, value: f} : {ok: false};
              }
              case "float": {
                  const f = rt.toFloat(v);
                  return f === null ? {ok: false} : {ok: true, value: f};
              }
              case "bool":
                  if (typeof v === "boolean") {
                      return {ok: true, value: v};
                  }
                  if (typeof v === "string" && ["true", "false"].includes(v.toLowerCase())) {
                      return {ok: true, value: v.toLowerCase() === "true"};
                  }
                  return v === 0 || v === 1 ? {ok: true, value: v === 1} : {ok: false};
              case "json":
                  return {ok: true, value: v};
          }
          if (typeof v === "string" || typeof v === "number" || typeof v === "boolean") {
              const text = rt.toText(v);
              return text.length <= 10000 ? {ok: true, value: text} : {ok: false};
          }
          return {ok: false};
      }

      function validate(table: Table, input: unknown, mode: string): Row {
          if (typeof input !== "object" || input === null || Array.isArray(input)) {
              rt.fail(400, "invalid_input");
          }
          const given = input as Row;
          const clean: Row = {};
          const bad: Record<string, string> = {};
          for (const c of table.columns) { // only columns of the schema are ever read: no mass assignment
              if (!Object.hasOwn(given, c.name)) {
                  if (mode === "full" && !c.nullable && !c.auto && !c.primary && !c.default) {
                      bad[c.name] = "required";
                  }
                  continue;
              }
              const v = given[c.name];
              if (v === null || v === undefined) {
                  if (c.nullable) {
                      clean[c.name] = null;
                  } else {
                      bad[c.name] = "required";
                  }
                  continue;
              }
              const result = coerce(c.kind, v);
              if (result.ok) {
                  clean[c.name] = result.value;
              } else {
                  bad[c.name] = "invalid";
              }
          }
          if (Object.keys(bad).length > 0) {
              throw new rt.ApiError(400, "invalid_input", bad);
          }
          return clean;
      }

      /** True when no primary key or unique column holds the same value twice. */
      function unique(table: Table, rows: Row[]): boolean {
          for (const c of table.columns) {
              if (!c.primary && !c.unique) {
                  continue;
              }
              const seen = new Set<string>();
              for (const r of rows) {
                  if (r[c.name] === null || r[c.name] === undefined) {
                      continue;
                  }
                  const key = rt.toText(r[c.name]);
                  if (seen.has(key)) {
                      return false;
                  }
                  seen.add(key);
              }
          }
          return true;
      }

      const same = (a: unknown, b: unknown): boolean => a !== null && a !== undefined && rt.toText(a) === rt.toText(b);

      function nextKey(rows: Row[], c: Column): any {
          if (c.kind !== "int") {
              return rt.newId();
          }
          let highest = 0;
          for (const r of rows) {
              const f = rt.toFloat(r[c.name]);
              if (f !== null && f > highest) {
                  highest = f;
              }
          }
          return highest + 1;
      }

      export function validateInput(name: string, input: unknown, mode: string): any {
          return validate(get(name), input, mode);
      }
      export {validateInput as validate};

      /** The rows whose column equals the value (at most 1000). No value means all rows. */
      export function find(name: string, column: string, value: unknown): any[] {
          const table = get(name);
          const col = resolve(table, column);
          const out: Row[] = [];
          for (const r of data[name]) {
              if (value === null || value === undefined || same(r[col], value)) {
                  out.push({...r});
                  if (out.length >= 1000) {
                      break;
                  }
              }
          }
          return out;
      }

      export function insert(name: string, values: unknown): any {
          const table = get(name);
          const r = validate(table, values, "full");
          const rows = data[name];
          for (const c of table.columns) {
              if (Object.hasOwn(r, c.name)) {
                  continue;
              }
              r[c.name] = null;
              if (c.primary || c.auto) {
                  r[c.name] = nextKey(rows, c);
              } else if (c.default) {
                  const lower = c.default.toLowerCase();
                  if (c.kind === "date" && ["now()", "now", "current_timestamp"].includes(lower)) {
                      r[c.name] = rt.now();
                  } else {
                      const result = coerce(c.kind, c.default);
                      if (result.ok) {
                          r[c.name] = result.value;
                      }
                  }
              }
          }
          const next = [...rows, r];
          if (!unique(table, next)) {
              rt.fail(409, "conflict");
          }
          data[name] = next;
          save();
          return {...r};
      }

      /** Changes the rows that match. The primary key is never changed. No value matches nothing. */
      export function update(name: string, column: string, value: unknown, values: unknown): any[] {
          const table = get(name);
          const col = resolve(table, column);
          const clean = validate(table, values, "partial");
          if (table.primary) {
              delete clean[table.primary];
          }
          if (value === null || value === undefined) {
              return [];
          }
          const out: Row[] = [];
          const next = data[name].map((r) => {
              if (!same(r[col], value)) {
                  return r;
              }
              const merged = {...r, ...clean};
              out.push({...merged});
              return merged;
          });
          if (out.length > 0) {
              if (!unique(table, next)) {
                  rt.fail(409, "conflict");
              }
              data[name] = next;
              save();
          }
          return out;
      }

      /** Deletes the rows that match and returns how many. No value deletes nothing. */
      export function remove(name: string, column: string, value: unknown): number {
          const table = get(name);
          const col = resolve(table, column);
          if (value === null || value === undefined) {
              return 0;
          }
          const kept = data[name].filter((r) => !same(r[col], value));
          const removed = data[name].length - kept.length;
          if (removed > 0) {
              data[name] = kept;
              save();
          }
          return removed;
      }
