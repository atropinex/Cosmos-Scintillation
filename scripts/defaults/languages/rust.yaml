# Rust: axum 0.7 + tokio (WebSockets through axum's built-in support). See docs/FORMATS.md section 2.
# Values in script code are serde_json::Value. Versions are written as TOML values, so a dependency can carry features.
id: rust
name: Rust (axum)
description: axum on tokio. Script nodes become plain statements over serde_json values; one small native binary.
capabilities: [rest, websocket]
runtime: "Rust 1.75+ (cargo)"
runCommand: "cargo run --release"
stringStyle: rust
indent: "    "
literals: { null: "Value::Null", true: "true", false: "false", object: "Value::Object(Default::default())", list: "Value::Array(Vec::new())" }
wrap: { string: "Value::from({{v}})", number: "rt::num({{v}}_f64)", boolean: "Value::Bool({{v}})" }
declare: "let {{name}} = {{expr}};"
usedMarker: "let _ = &{{name}};"
dependencies:
  - { name: axum, version: '{ version = "0.7.9", features = ["ws"] }' }
  - { name: tokio, version: '{ version = "1", features = ["full"] }' }
  - { name: serde, version: '{ version = "1", features = ["derive"] }' }
  - { name: serde_json, version: '"1"' }
  - { name: serde_urlencoded, version: '"0.7"' }
  - { name: sha2, version: '"0.10"' }
  - { name: subtle, version: '"2.6"' }
  - { name: uuid, version: '{ version = "1", features = ["v4"] }' }
  - { name: chrono, version: '{ version = "0.4", default-features = false, features = ["clock"] }' }
  - { name: futures-util, version: '"0.3"', when: websocket }
dependencyFormat: "{{name}} = {{version}}"
devDependencyFormat: "{{name}} = {{version}}"
dependencySeparator: "\n"
packages:
  - id: compression
    name: Compression
    description: gzip answers with tower-http
    dependencies: [ { name: tower-http, version: '{ version = "0.6", features = ["compression-gzip", "set-header"] }' } ]
    imports: []
    setup: [ "let app = app.layer(tower_http::compression::CompressionLayer::new());" ]
  - id: access-log
    name: Access log
    description: Writes one line per request to the console (method, path, status, milliseconds)
    imports: []
    setup:
      - |
        let app = app.layer(axum::middleware::from_fn(|req: axum::extract::Request, next: axum::middleware::Next| async move {
            let line = format!("{} {}", req.method(), req.uri().path());
            let started = std::time::Instant::now();
            let response = next.run(req).await;
            rt::log("info", &Value::from(format!("{} {} {}ms", line, response.status().as_u16(), started.elapsed().as_millis())));
            response
        }));
  - id: hsts
    name: HSTS header
    description: Tells browsers to use HTTPS only. Turn on when the API sits behind HTTPS.
    dependencies: [ { name: tower-http, version: '{ version = "0.6", features = ["compression-gzip", "set-header"] }' } ]
    imports: []
    setup:
      - |
        let app = app.layer(tower_http::set_header::SetResponseHeaderLayer::overriding(
            axum::http::header::STRICT_TRANSPORT_SECURITY,
            axum::http::HeaderValue::from_static("max-age=63072000; includeSubDomains"),
        ));
  - id: request-id
    name: Request id
    description: Adds an X-Request-Id header (a fresh random id) to every answer, handy for support requests
    imports: []
    setup:
      - |
        let app = app.layer(axum::middleware::from_fn(|req: axum::extract::Request, next: axum::middleware::Next| async move {
            let mut response = next.run(req).await;
            if let Ok(value) = axum::http::HeaderValue::from_str(&rt::to_text(&rt::new_id())) {
                response.headers_mut().insert("x-request-id", value);
            }
            response
        }));
websocket:
  imports: [ "mod wsrt;" ]
  setup: |
    async fn ws_dispatch(ws: wsrt::Conn, event: String, req: rt::Req) -> Result<(), rt::ApiError> {
        let _ = &req;
        match event.as_str() {
            {{wsHandlers}}
            _ => return Err(rt::ApiError::new(400, "unknown_event")),
        }
        Ok(())
    }
    let app = wsrt::mount(app, ws_dispatch);
files:
  - path: Cargo.toml
    template: |
      [package]
      name = "{{appSlug}}"
      version = "0.1.0"
      edition = "2021"

      [dependencies]
      {{dependencies}}

      [profile.release]
      opt-level = 3
      lto = true
      strip = true
  - path: src/main.rs
    template: |
      // {{appName}}: generated by Cosmos-Scintillation. Settings come from .env (see README.md).
      #![allow(unused_imports, unused_variables, unreachable_code)]
      mod rt;
      mod store;
      {{wsImports}}

      use serde_json::Value;
      {{imports}}

      #[tokio::main]
      async fn main() {
          let cfg = rt::load_config({{requireApiKey}}, {{port}}, {{maxBodyKb}}, {{rateLimit}});
          store::open(&cfg.data_dir, {{schemaJson}});

          let app = axum::Router::new();

          {{routes}}

          {{wsSetup}}

          let app = rt::secure(app);
          {{setup}}
          rt::serve(app).await;
      }
  - path: src/rt.rs
    template: |
      //! The runtime of the generated API: settings, security and the small helpers the script nodes call.
      //! Values are serde_json values: null, bool, number, string, array and object.
      use std::cmp::Ordering;
      use std::collections::HashMap;
      use std::future::Future;
      use std::net::{IpAddr, SocketAddr};
      use std::sync::{Mutex, OnceLock};
      use std::time::{Duration, Instant};

      use axum::extract::{ConnectInfo, Path, Request};
      use axum::http::{header, HeaderMap, HeaderValue, Method, StatusCode};
      use axum::middleware::Next;
      use axum::response::IntoResponse;
      use axum::routing::{delete, get, patch, post, put};
      use axum::Router;
      use serde_json::{json, Map, Value};
      use sha2::{Digest, Sha256};
      use subtle::ConstantTimeEq;

      pub type Response = axum::response::Response;

      // === Settings === //

      pub struct Config {
          pub auth: bool,
          pub api_key: String,
          pub origins: Vec<String>,
          pub max_body: usize,
          pub rate_limit: u32,
          pub host: String,
          pub port: u16,
          pub data_dir: String,
          pub timeout: Duration,
      }

      static CONFIG: OnceLock<Config> = OnceLock::new();

      pub fn config() -> &'static Config {
          CONFIG.get().expect("the settings are loaded first")
      }

      fn env_number<T: std::str::FromStr>(name: &str, fallback: T) -> T {
          std::env::var(name).ok().and_then(|v| v.trim().parse().ok()).unwrap_or(fallback)
      }

      fn env_text(name: &str, fallback: &str) -> String {
          let value = std::env::var(name).unwrap_or_default();
          if value.trim().is_empty() { fallback.to_string() } else { value.trim().to_string() }
      }

      /// Reads KEY=VALUE lines. Variables that are already set win, so the real environment overrides the file.
      fn load_env_file(path: &str) {
          let Ok(content) = std::fs::read_to_string(path) else { return };
          for raw in content.lines() {
              let line = raw.trim();
              if line.starts_with('#') {
                  continue;
              }
              let Some((key, value)) = line.split_once('=') else { continue };
              let key = key.trim();
              if !key.is_empty() && std::env::var_os(key).is_none() {
                  std::env::set_var(key, value.trim().trim_matches(|c| c == '"' || c == '\''));
              }
          }
      }

      /// Reads the settings. It stops the program when the API key is required but missing.
      pub fn load_config(auth: bool, port: u16, max_body_kb: u64, rate_limit: u32) -> &'static Config {
          load_env_file(".env");
          let cfg = Config {
              auth,
              api_key: std::env::var("API_KEY").unwrap_or_default(),
              origins: std::env::var("ALLOWED_ORIGINS").unwrap_or_default().split(',').map(|o| o.trim().to_string()).filter(|o| !o.is_empty()).collect(),
              max_body: (env_number("MAX_BODY_KB", max_body_kb) * 1024) as usize,
              rate_limit: env_number("RATE_LIMIT_PER_MIN", rate_limit),
              host: env_text("HOST", "127.0.0.1"),
              port: env_number("PORT", port),
              data_dir: env_text("DATA_DIR", "data"),
              timeout: Duration::from_secs(env_number("REQUEST_TIMEOUT_SECONDS", 15u64)),
          };
          if cfg.auth && cfg.api_key.is_empty() {
              eprintln!("API_KEY is empty. Set it in .env (or turn the API key off in the script).");
              std::process::exit(1);
          }
          CONFIG.get_or_init(|| cfg)
      }

      pub fn origin_allowed(origin: &str) -> bool {
          config().origins.iter().any(|allowed| allowed == "*" || allowed == origin)
      }

      /// Compares the key in constant time (both sides are hashed first, so the length does not leak).
      pub fn key_ok(key: Option<&str>) -> bool {
          let cfg = config();
          match key {
              Some(key) if !key.is_empty() && !cfg.api_key.is_empty() => {
                  let a = Sha256::digest(key.as_bytes());
                  let b = Sha256::digest(cfg.api_key.as_bytes());
                  bool::from(a.as_slice().ct_eq(b.as_slice()))
              }
              _ => false,
          }
      }

      // === Errors and answers === //

      /// An error with the status and the code that the client gets. `?` turns it into the JSON answer.
      #[derive(Debug)]
      pub struct ApiError {
          pub status: u16,
          pub code: &'static str,
          pub fields: Option<Value>,
      }

      impl ApiError {
          pub fn new(status: u16, code: &'static str) -> Self {
              ApiError { status, code, fields: None }
          }

          pub fn body(&self) -> Value {
              let mut body = json!({ "error": self.code });
              if let Some(fields) = &self.fields {
                  body["fields"] = fields.clone();
              }
              body
          }
      }

      impl IntoResponse for ApiError {
          fn into_response(self) -> Response {
              json_response(self.status, &self.body())
          }
      }

      pub fn json_response(status: u16, body: &Value) -> Response {
          let status = StatusCode::from_u16(status).unwrap_or(StatusCode::INTERNAL_SERVER_ERROR);
          let (status, bytes) = match serde_json::to_vec(body) {
              Ok(bytes) => (status, bytes),
              Err(_) => (StatusCode::INTERNAL_SERVER_ERROR, br#"{"error":"internal_error"}"#.to_vec()),
          };
          (status, [(header::CONTENT_TYPE, "application/json; charset=utf-8")], bytes).into_response()
      }

      pub fn send(status: &Value, body: &Value) -> Response {
          let code = to_f64(status).filter(|c| *c >= 200.0 && *c <= 599.0).unwrap_or(500.0) as u16;
          if code == 204 || code == 304 {
              return StatusCode::from_u16(code).unwrap_or(StatusCode::NO_CONTENT).into_response();
          }
          json_response(code, body)
      }

      pub async fn not_found() -> Response {
          ApiError::new(404, "not_found").into_response()
      }

      // === Security: headers, CORS, rate limit === //

      fn rate_ok(ip: IpAddr) -> bool {
          static HITS: OnceLock<Mutex<HashMap<IpAddr, (Instant, u32)>>> = OnceLock::new();
          let limit = config().rate_limit;
          if limit == 0 {
              return true;
          }
          let mut hits = HITS.get_or_init(|| Mutex::new(HashMap::new())).lock().unwrap_or_else(|p| p.into_inner());
          let now = Instant::now();
          let fresh = hits.get(&ip).map_or(true, |(start, _)| now.duration_since(*start) >= Duration::from_secs(60));
          if fresh {
              if hits.len() > 10000 { // bound the memory: forget old clients first, then everybody
                  hits.retain(|_, (start, _)| now.duration_since(*start) < Duration::from_secs(60));
                  if hits.len() > 10000 {
                      hits.clear();
                  }
              }
              hits.insert(ip, (now, 0));
          }
          let entry = hits.get_mut(&ip).expect("just inserted");
          entry.1 += 1;
          entry.1 <= limit
      }

      /// Adds the security headers, answers CORS only for ALLOWED_ORIGINS and limits the requests per client.
      pub fn secure(app: Router) -> Router {
          app.fallback(not_found).layer(axum::middleware::from_fn(guard))
      }

      async fn guard(ConnectInfo(addr): ConnectInfo<SocketAddr>, request: Request, next: Next) -> Response {
          let origin = request.headers().get(header::ORIGIN).and_then(|v| v.to_str().ok()).filter(|o| !o.is_empty()).map(str::to_owned);
          let allowed = origin.as_deref().map_or(false, origin_allowed);
          let mut response = if request.method() == Method::OPTIONS {
              if origin.is_some() && !allowed {
                  ApiError::new(403, "origin_not_allowed").into_response()
              } else {
                  StatusCode::NO_CONTENT.into_response()
              }
          } else if !rate_ok(addr.ip()) {
              let mut limited = ApiError::new(429, "rate_limited").into_response();
              limited.headers_mut().insert(header::RETRY_AFTER, HeaderValue::from_static("60"));
              limited
          } else {
              next.run(request).await
          };
          let h = response.headers_mut();
          h.insert(header::X_CONTENT_TYPE_OPTIONS, HeaderValue::from_static("nosniff"));
          h.insert(header::X_FRAME_OPTIONS, HeaderValue::from_static("DENY"));
          h.insert(header::REFERRER_POLICY, HeaderValue::from_static("no-referrer"));
          h.insert(header::CONTENT_SECURITY_POLICY, HeaderValue::from_static("default-src 'none'; frame-ancestors 'none'"));
          h.insert(header::CACHE_CONTROL, HeaderValue::from_static("no-store"));
          if let (true, Some(origin)) = (allowed, origin.as_deref()) {
              if let Ok(value) = HeaderValue::from_str(origin) {
                  h.append(header::VARY, HeaderValue::from_static("Origin"));
                  h.insert(header::ACCESS_CONTROL_ALLOW_ORIGIN, value);
                  h.insert(header::ACCESS_CONTROL_ALLOW_HEADERS, HeaderValue::from_static("Content-Type, X-API-Key"));
                  h.insert(header::ACCESS_CONTROL_ALLOW_METHODS, HeaderValue::from_static("GET, POST, PUT, PATCH, DELETE"));
                  h.insert(header::ACCESS_CONTROL_MAX_AGE, HeaderValue::from_static("600"));
              }
          }
          response
      }

      // === Routes === //

      /// What the script sees of a request (or of a WebSocket message: only body is set there).
      #[derive(Default)]
      pub struct Req {
          pub body: Value,
          pub query: HashMap<String, String>,
          pub params: HashMap<String, String>,
          pub headers: HeaderMap,
      }

      async fn run<F, Fut>(auth: bool, params: HashMap<String, String>, request: Request, handler: F) -> Result<Response, ApiError>
      where
          F: Fn(Req) -> Fut,
          Fut: Future<Output = Result<Response, ApiError>>,
      {
          let (parts, body) = request.into_parts();
          if auth && !key_ok(parts.headers.get("x-api-key").and_then(|v| v.to_str().ok())) {
              return Err(ApiError::new(401, "unauthorized"));
          }
          let limit = config().max_body;
          let declared = parts.headers.get(header::CONTENT_LENGTH).and_then(|v| v.to_str().ok()).and_then(|v| v.parse::<usize>().ok());
          let mut value = Value::Null;
          if parts.method != Method::GET && parts.method != Method::HEAD {
              if declared.map_or(false, |n| n > limit) {
                  return Err(ApiError::new(413, "payload_too_large"));
              }
              let bytes = axum::body::to_bytes(body, limit).await.map_err(|_| ApiError::new(413, "payload_too_large"))?;
              if !bytes.iter().all(|b| b.is_ascii_whitespace()) {
                  let json_type = parts.headers.get(header::CONTENT_TYPE).and_then(|v| v.to_str().ok()).map_or(false, |v| v.to_ascii_lowercase().contains("json"));
                  if !json_type {
                      return Err(ApiError::new(415, "unsupported_media_type"));
                  }
                  value = serde_json::from_slice(&bytes).map_err(|_| ApiError::new(400, "invalid_json"))?;
              }
          }
          let mut query = HashMap::new();
          if let Some(raw) = parts.uri.query() {
              for (key, item) in serde_urlencoded::from_str::<Vec<(String, String)>>(raw).unwrap_or_default() {
                  query.entry(key).or_insert(item);
              }
          }
          handler(Req { body: value, query, params, headers: parts.headers }).await
      }

      /// Registers a route: the key check comes first, then the body is read and parsed (at most MAX_BODY_KB).
      pub fn route<F, Fut>(app: Router, method: &str, path: &str, auth: bool, handler: F) -> Router
      where
          F: Fn(Req) -> Fut + Clone + Send + Sync + 'static,
          Fut: Future<Output = Result<Response, ApiError>> + Send + 'static,
      {
          let endpoint = move |params: Option<Path<HashMap<String, String>>>, request: Request| {
              let handler = handler.clone();
              async move {
                  let params = params.map(|Path(p)| p).unwrap_or_default();
                  match tokio::time::timeout(config().timeout, run(auth, params, request, handler)).await {
                      Ok(Ok(response)) => response,
                      Ok(Err(error)) => {
                          if error.code == "internal_error" {
                              log("error", &Value::from("unexpected failure"));
                          }
                          error.into_response()
                      }
                      Err(_) => ApiError::new(503, "timeout").into_response(),
                  }
              }
          };
          let methods = match method {
              "GET" => get(endpoint),
              "POST" => post(endpoint),
              "PUT" => put(endpoint),
              "PATCH" => patch(endpoint),
              _ => delete(endpoint),
          };
          app.route(path, methods)
      }

      pub async fn serve(app: Router) {
          let cfg = config();
          let address = format!("{}:{}", cfg.host, cfg.port);
          let listener = match tokio::net::TcpListener::bind(&address).await {
              Ok(listener) => listener,
              Err(error) => {
                  eprintln!("cannot listen on {address}: {error}");
                  std::process::exit(1);
              }
          };
          println!("listening on http://{address}");
          if axum::serve(listener, app.into_make_service_with_connect_info::<SocketAddr>()).await.is_err() {
              std::process::exit(1);
          }
      }

      /// Writes one line. Line breaks and other control characters are replaced, so text from a request cannot fake a log line.
      pub fn log(level: &str, message: &Value) {
          let text: String = to_text(message)
              .chars()
              .take(500)
              .map(|c| if (c as u32) < 32 || c == '\u{7f}' || c == '\u{2028}' || c == '\u{2029}' { ' ' } else { c })
              .collect();
          let level = if level == "warn" || level == "error" { level } else { "info" };
          println!("[{level}] {text}");
      }

      // === Values === //

      fn number_text(s: &str) -> bool {
          let s = s.strip_prefix('-').unwrap_or(s);
          let (whole, fraction) = match s.split_once('.') {
              Some((a, b)) => (a, Some(b)),
              None => (s, None),
          };
          !whole.is_empty() && whole.bytes().all(|b| b.is_ascii_digit()) && fraction.map_or(true, |f| !f.is_empty() && f.bytes().all(|b| b.is_ascii_digit()))
      }

      /// Makes a number value. Whole numbers stay whole ("3", not "3.0").
      pub fn num(x: f64) -> Value {
          if !x.is_finite() {
              Value::Null
          } else if x == x.trunc() && x.abs() < 1e15 {
              Value::from(x as i64)
          } else {
              Value::from(x)
          }
      }

      /// Reads numbers and number-like text ("12", "-3.5"). Other text is not a number.
      pub fn to_f64(v: &Value) -> Option<f64> {
          match v {
              Value::Number(n) => n.as_f64().filter(|x| x.is_finite()),
              Value::String(s) if number_text(s) => s.parse().ok(),
              _ => None,
          }
      }

      pub fn to_text(v: &Value) -> String {
          match v {
              Value::Null => String::new(),
              Value::String(s) => s.clone(),
              Value::Bool(b) => b.to_string(),
              Value::Number(n) => match n.as_f64() {
                  Some(x) if x == x.trunc() && x.abs() < 1e15 => (x as i64).to_string(),
                  _ => n.to_string(),
              },
              other => other.to_string(),
          }
      }

      pub fn truthy(v: &Value) -> bool {
          match v {
              Value::Null => false,
              Value::Bool(b) => *b,
              Value::String(s) => !matches!(s.trim().to_lowercase().as_str(), "" | "false" | "no" | "0"),
              Value::Array(items) => !items.is_empty(),
              Value::Object(map) => !map.is_empty(),
              Value::Number(_) => to_f64(v).map_or(true, |f| f != 0.0),
          }
      }

      pub fn body(req: &Req, key: &str) -> Value {
          req.body.get(key).cloned().unwrap_or(Value::Null)
      }

      pub fn query(req: &Req, key: &str) -> Value {
          req.query.get(key).map_or(Value::Null, |v| Value::from(v.as_str()))
      }

      pub fn param(req: &Req, key: &str) -> Value {
          req.params.get(key).filter(|v| !v.is_empty()).map_or(Value::Null, |v| Value::from(v.as_str()))
      }

      pub fn header(req: &Req, key: &str) -> Value {
          req.headers.get(key).and_then(|v| v.to_str().ok()).filter(|v| !v.is_empty()).map_or(Value::Null, Value::from)
      }

      /// The value itself, or the request body when nothing was wired.
      pub fn or_body(req: &Req, value: &Value) -> Value {
          if value.is_null() { req.body.clone() } else { value.clone() }
      }

      pub fn cmp(a: &Value, op: &str, b: &Value) -> Value {
          Value::Bool(match op {
              "contains" => match a {
                  Value::Array(items) => items.iter().any(|item| to_text(item) == to_text(b)),
                  _ => to_text(a).contains(&to_text(b)),
              },
              "startsWith" => to_text(a).starts_with(&to_text(b)),
              _ => {
                  let order = match (to_f64(a), to_f64(b)) {
                      (Some(x), Some(y)) => x.partial_cmp(&y).unwrap_or(Ordering::Equal),
                      _ => to_text(a).cmp(&to_text(b)),
                  };
                  match op {
                      "eq" => order == Ordering::Equal,
                      "ne" => order != Ordering::Equal,
                      "lt" => order == Ordering::Less,
                      "le" => order != Ordering::Greater,
                      "gt" => order == Ordering::Greater,
                      "ge" => order != Ordering::Less,
                      _ => false,
                  }
              }
          })
      }

      pub fn logic(a: &Value, op: &str, b: &Value) -> Value {
          Value::Bool(match op {
              "and" => truthy(a) && truthy(b),
              "or" => truthy(a) || truthy(b),
              _ => !truthy(a),
          })
      }

      pub fn concat(a: &Value, b: &Value, separator: &str) -> Value {
          Value::String(format!("{}{}{}", to_text(a), separator, to_text(b)))
      }

      pub fn text(v: &Value, op: &str) -> Value {
          let t = to_text(v);
          match op {
              "upper" => Value::String(t.to_uppercase()),
              "lower" => Value::String(t.to_lowercase()),
              "length" => num(t.chars().count() as f64),
              _ => Value::String(t.trim().to_string()),
          }
      }

      pub fn math(a: &Value, op: &str, b: &Value) -> Value {
          let (Some(x), Some(y)) = (to_f64(a), to_f64(b)) else { return Value::Null };
          let result = match op {
              "add" => Some(x + y),
              "sub" => Some(x - y),
              "mul" => Some(x * y),
              "div" => (y != 0.0).then(|| x / y),
              "mod" => (y != 0.0).then(|| x % y),
              "min" => Some(x.min(y)),
              "max" => Some(x.max(y)),
              _ => None,
          };
          result.map_or(Value::Null, num)
      }

      pub fn now() -> Value {
          Value::String(chrono::Utc::now().format("%Y-%m-%dT%H:%M:%S%.3fZ").to_string())
      }

      pub fn new_id() -> Value {
          Value::String(uuid::Uuid::new_v4().to_string())
      }

      pub fn field(obj: &Value, key: &str) -> Value {
          obj.get(key).cloned().unwrap_or(Value::Null)
      }

      pub fn obj(pairs: [(&str, &Value); 3]) -> Value {
          let mut out = Map::new();
          for (key, value) in pairs {
              if !key.is_empty() {
                  out.insert(key.to_string(), value.clone());
              }
          }
          Value::Object(out)
      }

      pub fn first(list: &Value) -> Value {
          list.as_array().and_then(|items| items.first()).cloned().unwrap_or(Value::Null)
      }

      pub fn count(list: &Value) -> Value {
          num(list.as_array().map_or(0, |items| items.len()) as f64)
      }
