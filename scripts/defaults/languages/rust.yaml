    template: |
      //! WebSocket support: origin, key, message size and message rate are checked before an event runs.
      use std::collections::HashMap;
      use std::future::Future;
      use std::sync::atomic::{AtomicU64, Ordering};
      use std::sync::{Mutex, OnceLock};
      use std::time::{Duration, Instant};

      use axum::extract::ws::{CloseFrame, Message, WebSocket, WebSocketUpgrade};
      use axum::extract::Query;
      use axum::http::HeaderMap;
      use axum::response::IntoResponse;
      use axum::routing::get;
      use axum::Router;
      use futures_util::{SinkExt, StreamExt};
      use serde_json::{json, Value};
      use tokio::sync::mpsc;

      use crate::rt::{self, ApiError, Req};

      /// One WebSocket client. It is a small copyable handle, so the script can use it as often as it likes.
      #[derive(Clone, Copy)]
      pub struct Conn {
          id: u64,
      }

      type Hub = Mutex<HashMap<u64, mpsc::Sender<Message>>>;

      fn hub() -> &'static Hub {
          static HUB: OnceLock<Hub> = OnceLock::new();
          HUB.get_or_init(|| Mutex::new(HashMap::new()))
      }

      static NEXT: AtomicU64 = AtomicU64::new(1);

      fn frame(event: &str, data: &Value) -> Message {
          Message::Text(json!({ "event": event, "data": data }).to_string())
      }

      fn sender(id: u64) -> Option<mpsc::Sender<Message>> {
          hub().lock().unwrap_or_else(|p| p.into_inner()).get(&id).cloned()
      }

      pub async fn send(ws: Conn, event: &str, data: &Value) {
          if let Some(tx) = sender(ws.id) {
              let _ = tx.try_send(frame(event, data));
          }
      }

      /// Sends to every other client, or to all of them (including the sender) when `to` is "all".
      pub async fn broadcast(ws: Conn, event: &str, data: &Value, to: &str) {
          let targets: Vec<mpsc::Sender<Message>> = hub()
              .lock()
              .unwrap_or_else(|p| p.into_inner())
              .iter()
              .filter(|(id, _)| **id != ws.id || to == "all")
              .map(|(_, tx)| tx.clone())
              .collect();
          for tx in targets {
              let _ = tx.try_send(frame(event, data));
          }
      }

      /// Adds /ws. It checks the origin and the API key before the upgrade, limits the message size and the messages per
      /// minute of every connection, and only accepts JSON text messages {"event": "...", "data": ...}.
      pub fn mount<F, Fut>(app: Router, dispatch: F) -> Router
      where
          F: Fn(Conn, String, Req) -> Fut + Clone + Send + Sync + 'static,
          Fut: Future<Output = Result<(), ApiError>> + Send + 'static,
      {
          let upgrade = move |ws: WebSocketUpgrade, headers: HeaderMap, Query(query): Query<HashMap<String, String>>| {
              let dispatch = dispatch.clone();
              async move {
                  let cfg = rt::config();
                  if let Some(origin) = headers.get("origin").and_then(|v| v.to_str().ok()) {
                      if !origin.is_empty() && !rt::origin_allowed(origin) {
                          return ApiError::new(403, "origin_not_allowed").into_response();
                      }
                  }
                  if cfg.auth {
                      let key = headers.get("x-api-key").and_then(|v| v.to_str().ok()).or(query.get("key").map(String::as_str));
                      if !rt::key_ok(key) {
                          return ApiError::new(401, "unauthorized").into_response();
                      }
                  }
                  let clients = hub().lock().unwrap_or_else(|p| p.into_inner()).len();
                  if clients >= 1000 {
                      return ApiError::new(503, "unavailable").into_response();
                  }
                  ws.max_message_size(cfg.max_body)
                      .max_frame_size(cfg.max_body)
                      .on_upgrade(move |socket| connection(socket, dispatch))
              }
          };
          app.route("/ws", get(upgrade))
      }

      async fn connection<F, Fut>(socket: WebSocket, dispatch: F)
      where
          F: Fn(Conn, String, Req) -> Fut,
          Fut: Future<Output = Result<(), ApiError>>,
      {
          let cfg = rt::config();
          let id = NEXT.fetch_add(1, Ordering::Relaxed);
          let (mut sink, mut stream) = socket.split();
          let (tx, mut rx) = mpsc::channel::<Message>(256);
          hub().lock().unwrap_or_else(|p| p.into_inner()).insert(id, tx);
          let writer = tokio::spawn(async move {
              while let Some(message) = rx.recv().await {
                  if sink.send(message).await.is_err() {
                      break;
                  }
              }
              let _ = sink.close().await;
          });

          let ws = Conn { id };
          let mut window = Instant::now();
          let mut count = 0u32;
          while let Some(Ok(message)) = stream.next().await {
              if window.elapsed() >= Duration::from_secs(60) {
                  window = Instant::now();
                  count = 0;
              }
              count += 1;
              if cfg.rate_limit > 0 && count > cfg.rate_limit {
                  if let Some(tx) = sender(id) {
                      let _ = tx.try_send(Message::Close(Some(CloseFrame { code: 1008, reason: "rate_limited".into() })));
                  }
                  break;
              }
              let text = match message {
                  Message::Text(text) => text,
                  Message::Close(_) => break,
                  Message::Ping(_) | Message::Pong(_) => continue,
                  _ => {
                      send(ws, "error", &json!({ "error": "invalid_message" })).await;
                      continue;
                  }
              };
              let (event, data) = match serde_json::from_str::<Value>(&text) {
                  Ok(Value::Object(mut map)) => match map.remove("event") {
                      Some(Value::String(event)) if !event.is_empty() => (event, map.remove("data").unwrap_or(Value::Null)),
                      _ => {
                          send(ws, "error", &json!({ "error": "invalid_message" })).await;
                          continue;
                      }
                  },
                  _ => {
                      send(ws, "error", &json!({ "error": "invalid_message" })).await;
                      continue;
                  }
              };
              if let Err(error) = dispatch(ws, event, Req { body: data, ..Default::default() }).await {
                  if error.code == "internal_error" {
                      rt::log("error", &Value::from("unexpected failure"));
                  }
                  send(ws, "error", &error.body()).await;
              }
          }
          hub().lock().unwrap_or_else(|p| p.into_inner()).remove(&id);
          let _ = writer.await;
      }
