    template: |
      //! A small data store for the generated API: tables in memory, saved to data/store.json.
      //! It only knows the tables and columns of the schema, so a request can never add or change anything else.
      use std::collections::{HashMap, HashSet};
      use std::path::PathBuf;
      use std::sync::{Mutex, MutexGuard, OnceLock};

      use serde::Deserialize;
      use serde_json::{Map, Value};

      use crate::rt::{self, ApiError};

      type Row = Map<String, Value>;

      #[derive(Deserialize, Clone)]
      struct Column {
          name: String,
          kind: String,
          #[serde(default)]
          primary: bool,
          #[serde(default)]
          unique: bool,
          #[serde(default)]
          nullable: bool,
          #[serde(default)]
          auto: bool,
          #[serde(default)]
          default: Value,
      }

      #[derive(Deserialize, Clone)]
      struct Table {
          name: String,
          #[serde(default)]
          primary: String,
          columns: Vec<Column>,
      }

      #[derive(Deserialize)]
      struct Schema {
          tables: Vec<Table>,
      }

      struct Store {
          tables: HashMap<String, Table>,
          data: HashMap<String, Vec<Row>>,
          file: PathBuf,
      }

      static STORE: OnceLock<Mutex<Store>> = OnceLock::new();

      fn internal() -> ApiError {
          ApiError::new(500, "internal_error")
      }

      fn lock() -> MutexGuard<'static, Store> {
          STORE.get().expect("the store is opened first").lock().unwrap_or_else(|p| p.into_inner())
      }

      /// Reads the schema (JSON text made by the exporter) and the saved rows.
      pub fn open(dir: &str, schema: &str) {
          let parsed: Schema = serde_json::from_str(schema).expect("the schema is not valid");
          let mut store = Store { tables: HashMap::new(), data: HashMap::new(), file: PathBuf::from(dir).join("store.json") };
          for table in parsed.tables {
              store.data.insert(table.name.clone(), Vec::new());
              store.tables.insert(table.name.clone(), table);
          }
          if let Ok(raw) = std::fs::read_to_string(&store.file) {
              if let Ok(saved) = serde_json::from_str::<HashMap<String, Vec<Row>>>(&raw) {
                  for (name, rows) in saved {
                      if store.tables.contains_key(&name) {
                          store.data.insert(name, rows);
                      }
                  }
              }
          }
          let _ = STORE.set(Mutex::new(store));
      }

      fn save(store: &Store) -> Result<(), ApiError> {
          let raw = serde_json::to_vec(&store.data).map_err(|_| internal())?;
          if let Some(parent) = store.file.parent() {
              std::fs::create_dir_all(parent).map_err(|_| internal())?;
          }
          let temp = store.file.with_extension("json.tmp");
          std::fs::write(&temp, raw).map_err(|_| internal())?;
          #[cfg(unix)]
          {
              use std::os::unix::fs::PermissionsExt;
              let _ = std::fs::set_permissions(&temp, std::fs::Permissions::from_mode(0o600));
          }
          std::fs::rename(&temp, &store.file).map_err(|_| internal())
      }

      fn table_of(store: &Store, name: &str) -> Result<Table, ApiError> {
          store.tables.get(name).cloned().ok_or_else(internal) // names come from the script, never from a request
      }

      /// The column to match on: the named one, else the primary key, else the first column.
      fn resolve(table: &Table, name: &str) -> Result<String, ApiError> {
          if name.is_empty() {
              return Ok(if table.primary.is_empty() { table.columns[0].name.clone() } else { table.primary.clone() });
          }
          if table.columns.iter().any(|c| c.name == name) { Ok(name.to_string()) } else { Err(internal()) }
      }

      fn default_text(c: &Column) -> Option<String> {
          match &c.default {
              Value::Null => None,
              Value::String(s) if s.is_empty() => None,
              other => Some(rt::to_text(other)),
          }
      }

      fn coerce(kind: &str, v: &Value) -> Option<Value> {
          match kind {
              "int" => {
                  let f = if v.is_boolean() { None } else { rt::to_f64(v) }?;
                  (f == f.trunc() && f.abs() <= 9e15).then(|| rt::num(f))
              }
              "float" => rt::to_f64(v).map(rt::num),
              "bool" => match v {
                  Value::Bool(b) => Some(Value::Bool(*b)),
                  Value::String(s) if s.eq_ignore_ascii_case("true") => Some(Value::Bool(true)),
                  Value::String(s) if s.eq_ignore_ascii_case("false") => Some(Value::Bool(false)),
                  Value::Number(n) if n.as_f64() == Some(0.0) => Some(Value::Bool(false)),
                  Value::Number(n) if n.as_f64() == Some(1.0) => Some(Value::Bool(true)),
                  _ => None,
              },
              "json" => Some(v.clone()),
              _ => match v {
                  Value::String(_) | Value::Number(_) | Value::Bool(_) => {
                      let text = rt::to_text(v);
                      (text.chars().count() <= 10000).then(|| Value::String(text))
                  }
                  _ => None,
              },
          }
      }

      fn validate_row(table: &Table, input: &Value, mode: &str) -> Result<Row, ApiError> {
          let Some(given) = input.as_object() else { return Err(ApiError::new(400, "invalid_input")) };
          let mut clean = Row::new();
          let mut bad = Map::new();
          for c in &table.columns { // only columns of the schema are ever read: no mass assignment
              match given.get(&c.name) {
                  None => {
                      if mode == "full" && !c.nullable && !c.auto && !c.primary && default_text(c).is_none() {
                          bad.insert(c.name.clone(), Value::from("required"));
                      }
                  }
                  Some(Value::Null) => {
                      if c.nullable {
                          clean.insert(c.name.clone(), Value::Null);
                      } else {
                          bad.insert(c.name.clone(), Value::from("required"));
                      }
                  }
                  Some(v) => match coerce(&c.kind, v) {
                      Some(value) => {
                          clean.insert(c.name.clone(), value);
                      }
                      None => {
                          bad.insert(c.name.clone(), Value::from("invalid"));
                      }
                  },
              }
          }
          if !bad.is_empty() {
              return Err(ApiError { status: 400, code: "invalid_input", fields: Some(Value::Object(bad)) });
          }
          Ok(clean)
      }

      /// True when no primary key or unique column holds the same value twice.
      fn is_unique(table: &Table, rows: &[Row]) -> bool {
          for c in table.columns.iter().filter(|c| c.primary || c.unique) {
              let mut seen = HashSet::new();
              for row in rows {
                  match row.get(&c.name) {
                      None | Some(Value::Null) => {}
                      Some(v) => {
                          if !seen.insert(rt::to_text(v)) {
                              return false;
                          }
                      }
                  }
              }
          }
          true
      }

      fn same(a: Option<&Value>, b: &Value) -> bool {
          a.map_or(false, |a| !a.is_null() && rt::to_text(a) == rt::to_text(b))
      }

      fn next_key(rows: &[Row], c: &Column) -> Value {
          if c.kind != "int" {
              return rt::new_id();
          }
          let highest = rows.iter().filter_map(|r| r.get(&c.name)).filter_map(rt::to_f64).fold(0.0, f64::max);
          rt::num(highest + 1.0)
      }

      pub fn validate(name: &str, input: &Value, mode: &str) -> Result<Value, ApiError> {
          let table = table_of(&lock(), name)?;
          validate_row(&table, input, mode).map(Value::Object)
      }

      /// The rows whose column equals the value (at most 1000). No value means all rows.
      pub fn find(name: &str, column: &str, value: &Value) -> Result<Value, ApiError> {
          let store = lock();
          let table = table_of(&store, name)?;
          let col = resolve(&table, column)?;
          let rows = store.data.get(name).map(|r| r.as_slice()).unwrap_or(&[]);
          let found: Vec<Value> = rows
              .iter()
              .filter(|r| value.is_null() || same(r.get(&col), value))
              .take(1000)
              .map(|r| Value::Object(r.clone()))
              .collect();
          Ok(Value::Array(found))
      }

      pub fn insert(name: &str, values: &Value) -> Result<Value, ApiError> {
          let mut store = lock();
          let table = table_of(&store, name)?;
          let mut row = validate_row(&table, values, "full")?;
          let rows = store.data.get(name).cloned().unwrap_or_default();
          for c in &table.columns {
              if row.contains_key(&c.name) {
                  continue;
              }
              row.insert(c.name.clone(), Value::Null);
              if c.primary || c.auto {
                  row.insert(c.name.clone(), next_key(&rows, c));
              } else if let Some(default) = default_text(c) {
                  let lower = default.to_lowercase();
                  if c.kind == "date" && (lower == "now()" || lower == "now" || lower == "current_timestamp") {
                      row.insert(c.name.clone(), rt::now());
                  } else if let Some(value) = coerce(&c.kind, &Value::String(default)) {
                      row.insert(c.name.clone(), value);
                  }
              }
          }
          let mut next = rows;
          next.push(row.clone());
          if !is_unique(&table, &next) {
              return Err(ApiError::new(409, "conflict"));
          }
          store.data.insert(name.to_string(), next);
          save(&store)?;
          Ok(Value::Object(row))
      }

      /// Changes the rows that match. The primary key is never changed. No value matches nothing.
      pub fn update(name: &str, column: &str, value: &Value, values: &Value) -> Result<Value, ApiError> {
          let mut store = lock();
          let table = table_of(&store, name)?;
          let col = resolve(&table, column)?;
          let mut clean = validate_row(&table, values, "partial")?;
          clean.remove(&table.primary);
          if value.is_null() {
              return Ok(Value::Array(Vec::new()));
          }
          let mut changed = Vec::new();
          let next: Vec<Row> = store
              .data
              .get(name)
              .cloned()
              .unwrap_or_default()
              .into_iter()
              .map(|mut r| {
                  if same(r.get(&col), value) {
                      for (k, v) in &clean {
                          r.insert(k.clone(), v.clone());
                      }
                      changed.push(Value::Object(r.clone()));
                  }
                  r
              })
              .collect();
          if !changed.is_empty() {
              if !is_unique(&table, &next) {
                  return Err(ApiError::new(409, "conflict"));
              }
              store.data.insert(name.to_string(), next);
              save(&store)?;
          }
          Ok(Value::Array(changed))
      }

      /// Deletes the rows that match and returns how many. No value deletes nothing.
      pub fn remove(name: &str, column: &str, value: &Value) -> Result<Value, ApiError> {
          let mut store = lock();
          let table = table_of(&store, name)?;
          let col = resolve(&table, column)?;
          if value.is_null() {
              return Ok(rt::num(0.0));
          }
          let rows = store.data.get(name).cloned().unwrap_or_default();
          let before = rows.len();
          let kept: Vec<Row> = rows.into_iter().filter(|r| !same(r.get(&col), value)).collect();
          let removed = before - kept.len();
          if removed > 0 {
              store.data.insert(name.to_string(), kept);
              save(&store)?;
          }
          Ok(rt::num(removed as f64))
      }
