id: sqlserver
name: SQL Server
description: Microsoft's relational database.
family: relational
exporter: sql
defaultPort: 1433
scriptExtension: sql
terms: { container: Table, containers: Tables, row: Row, rows: Rows, field: Column, fields: Columns }
relations: true
defaultType: nvarchar(255)
keyType: uniqueidentifier
types:
  - { id: uniqueidentifier, label: uniqueidentifier }
  - { id: int, label: int }
  - { id: bigint, label: bigint }
  - { id: smallint, label: smallint }
  - { id: bit, label: bit (boolean) }
  - { id: nvarchar(255), label: nvarchar(255) }
  - { id: nvarchar(max), label: nvarchar(max) }
  - { id: char(1), label: char(1) }
  - { id: "decimal(12,2)", label: "decimal(12,2)" }
  - { id: float, label: float }
  - { id: date, label: date }
  - { id: time, label: time }
  - { id: datetime2, label: datetime2 }
  - { id: datetimeoffset, label: datetimeoffset }
  - { id: varbinary(max), label: varbinary(max) }
sql:
  quote: "["
  autoIncrement: identity
  tableSuffix: ""
  header: ""
  trueLiteral: "1"
  falseLiteral: "0"
